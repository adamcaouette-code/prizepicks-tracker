ey(p));\nlet trayEntry = 'power';\nlet trayMathReq = 0;                 // guards against a slow response overwriting a newer one\n\n// Same player + same stat can only appear once, whatever the line. PrizePicks\n// won't accept one prop twice, and two lines of it are NESTED rather than\n// independent — under 6.5 already means under 7.5 — so the parlay math would be\n// wrong even if the book allowed it.\nconst propKeyOf = l => [l.player, l.statDisplay || l.stat]\n  .map(x => String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'')).join('|');\n\nfunction trayToggle(key){\n  const i = tray.findIndex(l => legKey(l) === key);\n  if(i >= 0) tray.splice(i, 1);\n  else {\n    const pick = PICK_POOL.get(key) || (LAST_RUN ? LAST_RUN.picks : []).find(p => legKey(p) === key);\n    if(!pick) return;\n    if(tray.length >= MAX_LEGS){ trayMsg('PrizePicks caps a slip at '+MAX_LEGS+' legs.', 'err'); return; }\n    const clash = tray.find(l => propKeyOf(l) === propKeyOf(pick));\n    if(clash){\n      trayMsg(pick.player+' '+(pick.statDisplay||pick.stat)+' is already on this slip at '+clash.line+\n        '. PrizePicks only takes a prop once, and two lines of it aren\\u2019t independent — '+\n        'remove that leg first if you want this line instead.', 'err');\n      return;\n    }\n    tray.push(pick);\n  }\n  renderBoardResults();              // repaint the +slip / ✓ state\n  renderLedger();                    // ...on both tabs that offer one\n  renderTray();\n}\n\nfunction trayMsg(text, kind){\n  const el = document.getElementById('trayMsg');\n  el.className = 'traymsg' + (kind ? ' '+kind : '');\n  el.textContent = text || '';\n}\n\nfunction renderTray(){\n  const sec = document.getElementById('slipTray');\n  sec.hidden = !tray.length;\n  if(!tray.length){\n    // Clear the markup too, not just hide it — a saved slip's legs lingering in\n    // a hidden container is stale state waiting to be shown by mistake.\n    document.getElementById('trayLegs').innerHTML='';\n    document.getElementById('trayMath').innerHTML='';\n    return;\n  }\n  document.getElementById('trayCount').textContent = tray.length+' of '+MAX_LEGS;\n  document.getElementById('trayLegs').innerHTML = tray.map(l=>{\n    const pc = toPct(l.sideProb!=null?l.sideProb:l.prob);\n    return '<div class=\"trayleg\">'+\n      '<div class=\"tl-name\">'+tierIcon(l.oddsType)+esc(l.player)+'<\u002Fdiv>'+\n      '<div class=\"tl-stat\">'+esc(l.statDisplay||l.stat)+' '+esc(l.side||l.pick||'over')+' '+esc(l.line)+'<\u002Fdiv>'+\n      '<div class=\"tl-prob\">'+(pc==null?'—':pc+'%')+'<\u002Fdiv>'+\n      '<button class=\"tl-x\" type=\"button\" data-drop=\"'+esc(legKey(l))+'\" aria-label=\"remove\">×<\u002Fbutton>'+\n    '<\u002Fdiv>';\n  }).join('');\n  loadTrayMath();\n}\n\n// Prices the current tray. Below 2 legs there is no parlay to price.\nasync function loadTrayMath(){\n  const box = document.getElementById('trayMath');\n  if(tray.length < 2){ box.innerHTML = '<div class=\"paynote\">Add at least 2 legs to price a slip.<\u002Fdiv>'; return; }\n  const stake = Math.max(0, Number(document.getElementById('trayStake').value) || 0);\n  const req = ++trayMathReq;\n  try{\n    const r = await fetch('/api/bet-finder-size', { method:'POST', headers:{'Content-Type':'application/json'},\n      body: JSON.stringify({ legs: tray.map(l=>({ prob: Number(l.sideProb!=null?l.sideProb:l.prob), oddsType: l.oddsType||'standard' })),\n        bankroll: stake || 100, floor: 0 }) });\n    const d = await readJSON(r, 'bet-finder-size');\n    if(req !== trayMathReq) return;                 // a newer request already answered\n    if(!r.ok || d.error){ box.innerHTML = '<div class=\"paynote\">Couldn’t price this slip: '+esc(d.error||r.status)+'<\u002Fdiv>'; return; }\n    TRAY_SIZING = d;\n    box.innerHTML = payTableHtml(d, stake);\n  }catch(e){\n    if(req === trayMathReq) box.innerHTML = '<div class=\"paynote\">Couldn’t price this slip: '+esc(e.message)+'<\u002Fdiv>';\n  }\n}\nlet TRAY_SIZING = null;\n\nfunction payTableHtml(d, stake){\n  const entry = d.entries && d.entries[trayEntry];\n  if(!entry) return '<div class=\"paynote\">'+esc(trayEntry.toUpperCase())+' isn’t offered at '+tray.length+' legs.<\u002Fdiv>';\n  const dist = d.hitDistribution || [];\n  // Price off the MULTIPLIER table times YOUR stake. entry.payouts is scaled by\n  // the Kelly-recommended stake, which is 0 whenever EV is negative — reading it\n  // here made every row show $0.00 exactly when the slip was worth questioning.\n  const table = entry.multipliers && entry.multipliers.length\n    ? entry.multipliers\n    : (entry.payouts||[]).map(p=>({ hits:p.hits, mult: entry.stake>0 ? p.pays/entry.stake : 0 }));\n  const rows = table.map(p=>{\n    const pays = stake * p.mult;\n    const chance = dist[p.hits] != null ? Math.round(dist[p.hits]*100) : null;\n    const best = p.hits === tray.length;\n    return '<div class=\"payrow'+(best?' best':'')+'\">'+\n      '<span>'+p.hits+' of '+tray.length+' hit'+(chance!=null?' · '+chance+'% likely':'')+'<\u002Fspan>'+\n      '<span><b>'+(stake>0?'$'+pays.toFixed(2):'—')+'<\u002Fb>'+(p.mult>0?' ('+p.mult.toFixed(2)+'x)':'')+'<\u002Fspan>'+\n    '<\u002Fdiv>';\n  });\n  const ev = entry.evPerDollar;\n  const notes = [];\n\n  // Lead with the comparison that makes the verdict legible. \"-51.6% EV\" is\n  // jargon; \"you need it to land 50% of the time, it lands 24%\" is not. There is\n  // never a 100% bet — the question is only whether the payout covers the risk.\n  if(d.breakEvenAllHit!=null && d.allHitProb!=null && trayEntry==='power'){\n    const need = Math.round(d.breakEvenAllHit*100), have = Math.round(d.allHitProb*100);\n    notes.push('All '+tray.length+' must land <b>'+need+'%<\u002Fb> of the time to break even at this payout. '+\n      'The engine puts it at <b class=\"'+(have>=need?'':'recwarn')+'\">'+have+'%<\u002Fb>.');\n  }\n  if(ev!=null){\n    notes.push((ev>0?'<b>+':'<b class=\"recwarn\">')+(ev*100).toFixed(1)+'%<\u002Fb> expected value per dollar'+\n      (ev>0 ? ' — the payout more than covers the risk.'\n            : ' — the payout doesn’t cover the risk. Not a comment on the picks.'));\n  }\n\n  // When a slip prices badly the TIER is usually the reason, and that's fixable.\n  // Same legs, different tier, completely different bet.\n  const alt = d.altTiers || {};\n  const better = Object.entries(alt)\n    .filter(([tier, a]) => a.evPerDollar > (ev ?? -1) + 0.05 && tier !== pureTierOf())\n    .sort((a, b) => b[1].evPerDollar - a[1].evPerDollar)[0];\n  if(ev!=null && ev<=0 && better){\n    notes.push('These exact legs as <b>'+esc(better[0])+'<\u002Fb> picks would be <b>'+\n      (better[1].evPerDollar>0?'+':'')+(better[1].evPerDollar*100).toFixed(1)+'%<\u002Fb> ('+\n      better[1].mult.toFixed(2)+'x, needs '+Math.round(better[1].breakEvenPerLeg*100)+'% a leg). '+\n      'The tier is what’s pricing this, not the picks.');\n  }\n  if(d.mixed) notes.push('Payouts are an estimate: no verified PrizePicks table for this exact tier mix.');\n\n  return '<div class=\"paytable\">'+\n      '<div class=\"payrow head\"><span>Outcome<\u002Fspan><span>Pays<\u002Fspan><\u002Fdiv>'+\n      rows.join('')+\n    '<\u002Fdiv>'+\n    '<div class=\"paynote\">'+notes.join('<br>')+'<\u002Fdiv>';\n}\n// The single tier every leg shares, or null for a mixed slip.\nfunction pureTierOf(){\n  const set = new Set(tray.map(l=>(l.oddsType||'standard').toLowerCase()));\n  return set.size===1 ? [...set][0] : null;\n}\n\ndocument.getElementById('slipTray').addEventListener('click', e=>{\n  const x = e.target.closest('.tl-x');\n  if(x){ trayToggle(x.dataset.drop); return; }\n  const et = e.target.closest('.etoggle');\n  if(et){\n    trayEntry = et.dataset.entry;\n    document.querySelectorAll('#slipTray .etoggle').forEach(b=>b.classList.toggle('active', b===et));\n    if(TRAY_SIZING) document.getElementById('trayMath').innerHTML =\n      payTableHtml(TRAY_SIZING, Math.max(0, Number(document.getElementById('trayStake').value)||0));\n  }\n});\ndocument.getElementById('trayStake').addEventListener('input', ()=>{\n  clearTimeout(window.__stakeT);\n  window.__stakeT = setTimeout(loadTrayMath, 250);   // debounce: typing \"100\" is 3 keystrokes\n});\n\ndocument.getElementById('traySave').addEventListener('click', async function(){\n  if(tray.length < 2){ trayMsg('A slip needs at least 2 legs.', 'err'); return; }\n  const btn = this; btn.disabled = true; trayMsg('Saving…');\n  try{\n    const stake = Math.max(0, Number(document.getElementById('trayStake').value) || 0);\n    const entry = TRAY_SIZING && TRAY_SIZING.entries ? TRAY_SIZING.entries[trayEntry] : null;\n    const r = await fetch('/api/slips', { method:'POST', headers:{'Content-Type':'application/json'},\n      body: JSON.stringify({\n        name: document.getElementById('trayName').value,\n        league: (LAST_RUN && LAST_RUN.out.params) ? LAST_RUN.out.params.league : null,\n        entry: trayEntry, stake,\n        legs: tray.map(l=>({ projectionId: l.projectionId || l.id || null, player: l.player, stat: l.statDisplay||l.stat,\n          line: l.line, pick: l.side||l.pick||'over', oddsType: l.oddsType, team: l.team, matchup: l.matchup,\n          start: l.start, prob: (l.sideProb!=null?l.sideProb:l.prob), image: l.headshot||l.image })),\n        // Freeze the payout table AS QUOTED, so a settled slip is paid against\n        // the numbers you actually saw, not whatever the table says later.\n        // Freeze the multiplier table AND the payouts computed at the stake\n        // actually entered, so a settled slip is paid the number that was on\n        // screen — not one rescaled from a Kelly stake that may have been 0.\n        sizing: entry ? {\n          label: entry.label,\n          multipliers: entry.multipliers || null,\n          payouts: (entry.multipliers || []).map(m=>({ hits:m.hits, pays: Math.round(stake*m.mult*100)/100 })),\n          evPerDollar: entry.evPerDollar, mixed: !!TRAY_SIZING.mixed,\n        } : null,\n      }) });\n    const d = await readJSON(r, 'slips');\n    if(!r.ok || d.error) throw new Error(d.error || ('save returned '+r.status));\n    trayMsg('Saved \"'+d.slip.name+'\" — it’ll update itself once the games settle.', 'ok');\n    tray = []; TRAY_SIZING = null;\n    document.getElementById('trayName').value = '';\n    renderBoardResults(); renderTray();\n    SLIPS_LOADED = false;             // next visit to My Slips refetches\n  }catch(e){\n    trayMsg(e.message || 'save failed', 'err');\n  }finally{ btn.disabled = false; }\n});\n\n/* ============================================================\n   MY SLIPS — collapsible saved slips, refreshed from the server.\n   Grading happens server-side (grade-cron -> /api/grade-slips), so this view\n   just reports; it never decides a hit itself.\n   ============================================================ */\nlet SLIPS_LOADED = false;\nconst MARK = { true:'✓', false:'✗' };\n\nfunction slipCardHtml(s){\n  const legs = s.legs || [];\n  const settled = legs.filter(l=>l.hit===true||l.hit===false).length;\n  const status = s.status || 'pending';\n  const when = s.slateDate || String(s.createdAt||'').slice(0,10);\n  const meta = [when, (s.entry||'power').toUpperCase(), legs.length+' legs',\n    s.stake!=null ? '$'+Number(s.stake).toFixed(2) : null].filter(Boolean).join(' · ');\n  // \"Pending\" alone is ambiguous — it looks identical whether the games haven't\n  // been played yet or the results simply haven't landed. Say which.\n  const today = new Date().toISOString().slice(0,10);\n  const notYetPlayed = status==='pending' && String(when||'') >= today;\n  const pillTxt = status==='pending' ? (settled?settled+'/'+legs.length+' in': notYetPlayed?'not played':'pending')\n    : status==='partial' ? 'partial · '+s.hits+'/'+legs.length\n    : status==='won' ? 'won' : status==='lost' ? 'lost'\n    : s.hits+'/'+settled+' · '+(s.ungradeableLegs||1)+' unknown';\n  const legRows = legs.map(l=>{\n    const mark = l.hit===true?'hit':l.hit===false?'miss':'pend';\n    const sym = l.ungradeable ? '–' : (l.hit===true||l.hit===false ? MARK[l.hit] : '·');\n    return '<div class=\"slipleg\">'+\n      '<div class=\"sl-mark '+mark+'\">'+sym+'<\u002Fdiv>'+\n      '<div class=\"sl-name\">'+tierIcon(l.oddsType)+esc(l.player)+'<\u002Fdiv>'+\n      '<div class=\"sl-line\">'+esc(l.stat)+' '+esc(l.pick)+' '+esc(l.line)+'<\u002Fdiv>'+\n      '<div class=\"sl-res\">'+(l.result!=null?esc(l.result):(l.ungradeable?esc(l.ungradeable):'—'))+'<\u002Fdiv>'+\n    '<\u002Fdiv>';\n  }).join('');\n  const paid = s.payout!=null\n    ? '<div class=\"paynote\">Paid <b style=\"color:var(--ink)\">$'+Number(s.payout).toFixed(2)+'<\u002Fb>'+\n      (s.stake ? ' on a $'+Number(s.stake).toFixed(2)+' entry' : '')+'.<\u002Fdiv>' : '';\n  // A leg with no live projection behind it can never be looked up. Say that\n  // plainly instead of leaving a card that looks broken.\n  const pendWhy = status==='pending'\n    ? '<div class=\"paynote\">'+(notYetPlayed\n        ? 'These games haven\\u2019t finished yet. Results settle automatically overnight, and again whenever you open this tab.'\n        : 'Waiting on final box scores. This settles overnight, or as soon as you open this tab once they land.')+'<\u002Fdiv>'\n    : '';\n  const unknown = status==='ungradeable'\n    ? '<div class=\"paynote\">'+(s.ungradeableLegs||1)+' leg'+((s.ungradeableLegs||1)===1?'':'s')+\n      ' couldn’t be looked up (no live projection behind '+((s.ungradeableLegs||1)===1?'it':'them')+\n      '), so this card can’t be fully settled. The graded legs are shown above.<\u002Fdiv>' : '';\n  return '<div class=\"slipcard\" data-id=\"'+esc(s.id)+'\">'+\n    '<button class=\"sliphead\" type=\"button\" aria-expanded=\"false\">'+\n      '<span class=\"sh-caret\">▸<\u002Fspan>'+\n      '<span class=\"sh-name\">'+esc(s.name||'Untitled slip')+'<\u002Fspan>'+\n      '<span class=\"sh-meta\">'+esc(meta)+'<\u002Fspan>'+\n      '<span class=\"pill '+status+'\">'+esc(pillTxt)+'<\u002Fspan>'+\n    '<\u002Fbutton>'+\n    '<div class=\"slipbody\" hidden>'+\n      legRows+ paid + unknown + pendWhy +\n      '<div class=\"slipacts\">'+\n        '<button type=\"button\" data-act=\"rename\">rename<\u002Fbutton>'+\n        '<button type=\"button\" data-act=\"delete\" class=\"danger\">delete<\u002Fbutton>'+\n      '<\u002Fdiv>'+\n    '<\u002Fdiv>'+\n  '<\u002Fdiv>';\n}\n\n// True when a slip's games are over but it still has no result — i.e. there is\n// something for a grading pass to actually do.\nconst awaitingResults = s =>\n  ['pending','ungradeable'].includes(s.status||'pending') &&\n  String(s.slateDate||'') < new Date().toISOString().slice(0,10);\n\nasync function loadSlips(force){\n  const body = document.getElementById('slipsBody');\n  const sum = document.getElementById('slipsSummary');\n  if(SLIPS_LOADED && !force) return;\n  body.innerHTML='<div class=\"skel\"><\u002Fdiv><div class=\"skel\"><\u002Fdiv>';\n  try{\n    let d = await getJSON('/api/slips', 'slips');\n    // The overnight cron settles slips at a fixed hour; open the app before it\n    // runs and last night's card would still read \"pending\". So if anything is\n    // waiting on results for a slate that has already finished, settle it now\n    // rather than showing a stale pending badge.\n    if((d.slips||[]).some(awaitingResults)){\n      body.innerHTML='<div class=\"step\"><div class=\"spin\"><\u002Fdiv><div class=\"step-text\">Settling last night’s slips…<\u002Fdiv><\u002Fdiv>';\n      try{\n        await fetch('/api/grade-slips');\n        d = await getJSON('/api/slips', 'slips');\n      }catch(e){ /* grading is best-effort — fall through and show what we have */ }\n    }\n    const slips = d.slips || [];\n    SLIPS_LOADED = true;\n    if(!slips.length){\n      sum.hidden = true;\n      body.innerHTML='<div class=\"empty\">No saved slips yet.<br>Build one from a board run and tap SAVE TO ATOMBETS.<\u002Fdiv>';\n      return;\n    }\n    // Honest record: only settled slips count. Pending ones are not \"not yet losses\".\n    const settled = slips.filter(s=>['won','lost','partial'].includes(s.status));\n    const won = settled.filter(s=>s.status==='won').length;\n    const part = settled.filter(s=>s.status==='partial').length;\n    const staked = settled.reduce((a,s)=>a+(Number(s.stake)||0),0);\n    const returned = settled.reduce((a,s)=>a+(Number(s.payout)||0),0);\n    sum.hidden = false;\n    sum.innerHTML = settled.length\n      ? 'SETTLED <b>'+settled.length+'<\u002Fb> · WON <b>'+won+'<\u002Fb>'+(part?' · PARTIAL <b>'+part+'<\u002Fb>':'')+\n        ' · LOST <b>'+(settled.length-won-part)+'<\u002Fb><br>'+\n        'STAKED <b>$'+staked.toFixed(2)+'<\u002Fb> · RETURNED <b>$'+returned.toFixed(2)+'<\u002Fb> · '+\n        'NET <b style=\"color:'+(returned-staked>=0?'var(--grn)':'var(--red)')+'\">'+\n        (returned-staked>=0?'+':'')+'$'+(returned-staked).toFixed(2)+'<\u002Fb>'+\n        (settled.length < 10 ? '<br><span style=\"color:var(--amb)\">n='+settled.length+' — too few to mean anything yet.<\u002Fspan>' : '')\n      : slips.length+' slip'+(slips.length===1?'':'s')+' saved, none settled yet. Results fill in after the games finish.';\n    sum.innerHTML += '<br><span style=\"color:var(--faint)\">Slips are kept for 3 days after their slate, then cleared.<\u002Fspan>';\n    body.innerHTML = slips.map(slipCardHtml).join('');\n  }catch(e){\n    body.innerHTML='<div class=\"errbox\">⚠ '+esc(e.message||'could not load slips')+'<\u002Fdiv>';\n  }\n}\n\ndocument.getElementById('slipsRefresh').addEventListener('click', ()=>loadSlips(true));\ndocument.getElementById('slipsBody').addEventListener('click', async e=>{\n  const head = e.target.closest('.sliphead');\n  if(head){\n    const panel = head.nextElementSibling;\n    const open = panel.hidden;\n    panel.hidden = !open;\n    head.setAttribute('aria-expanded', String(open));\n    head.querySelector('.sh-caret').textContent = open ? '▾' : '▸';\n    return;\n  }\n  const act = e.target.closest('[data-act]');\n  if(!act) return;\n  const card = act.closest('.slipcard');\n  const id = card.dataset.id;\n  const name = card.querySelector('.sh-name').textContent;\n  if(act.dataset.act === 'rename'){\n    const next = prompt('Name this slip', name);\n    if(next == null || !next.trim()) return;\n    try{\n      const r = await fetch('/api/slips?action=rename', { method:'POST', headers:{'Content-Type':'application/json'},\n        body: JSON.stringify({ id, name: next }) });\n      const d = await readJSON(r, 'slips');\n      if(!r.ok || d.error) throw new Error(d.error || ('rename returned '+r.status));\n      loadSlips(true);\n    }catch(err){ alert('Rename failed: '+err.message); }\n  } else if(act.dataset.act === 'delete'){\n    if(!confirm('Delete \"'+name+'\"? This cannot be undone.')) return;\n    try{\n      const r = await fetch('/api/slips?action=delete', { method:'POST', headers:{'Content-Type':'application/json'},\n        body: JSON.stringify({ id }) });\n      const d = await readJSON(r, 'slips');\n      if(!r.ok || d.error) throw new Error(d.error || ('delete returned '+r.status));\n      loadSlips(true);\n    }catch(err){ alert('Delete failed: '+err.message); }\n  }\n});\n\n/* ---- last-run timing panel (the on-screen half of runReport) ---- */\ndocument.getElementById('runReportBtn').addEventListener('click', e=>{\n  e.preventDefault();\n  const box = document.getElementById('runReportBox');\n  box.hidden = !box.hidden;\n  e.target.textContent = box.hidden ? '◇ Last Run Timing' : '◇ Hide Timing';\n});\n\n/* ---- per-pick fold toggles (delegated: rows are re-rendered each run) ----\n   One card can carry two panels now (stats + why); the button's data-panel names\n   which one it drives, scoped to its own card so cards never cross-toggle. */\nfunction wireFolds(container){\n  container.addEventListener('click', e=>{\n    const btn = e.target.closest('.whybtn');\n    if(!btn) return;\n    const leg = btn.closest('.leg');\n    const name = btn.dataset.panel || 'why';\n    const panel = leg && leg.querySelector('.why[data-panel=\"'+name+'\"]');\n    if(!panel) return;\n    const opening = panel.hidden;\n    panel.hidden = !opening;\n    btn.setAttribute('aria-expanded', String(opening));\n    btn.textContent = (btn.dataset.lbl||'why') + (opening ? ' ↑' : ' ↓');\n    // The MLB panel is the one that isn't already in the run result — it's\n    // fetched the first time you open it, which is what keeps it off the run's\n    // critical path. Cached per player for the session after that.\n    if(opening && name === 'mlb' && btn.dataset.mlb && !panel.dataset.loaded){\n      loadMlbPanel(panel, btn.dataset.mlb);\n    }\n  });\n}\n\n/* ---- lazy MLB player detail (raw statsapi.mlb.com data, no model) ---- */\nconst MLB_CACHE = {};\nasync function loadMlbPanel(panel, id){\n  panel.dataset.loaded = '1';\n  panel.innerHTML = '<div class=\"statline\">Loading MLB numbers…<\u002Fdiv>';\n  try{\n    if(!MLB_CACHE[id]) MLB_CACHE[id] = await getJSON('/api/mlb-stats?mode=player&id='+encodeURIComponent(id), 'mlb-stats');\n    const d = MLB_CACHE[id];\n    if(d.error) throw new Error(d.error);\n    panel.innerHTML = mlbHtml(d);\n  }catch(e){\n    // A failed enrichment must read as \"unavailable\", never as a broken card.\n    panel.dataset.loaded = '';           // let a retry happen on the next open\n    delete MLB_CACHE[id];\n    panel.innerHTML = '<div class=\"statline\">MLB numbers unavailable right now'+\n      (e && e.message ? ' ('+esc(e.message)+')' : '')+'.<\u002Fdiv>';\n  }\n}\nfunction mlbHtml(d){\n  const rows = [];\n  const S = d.season || {};\n  const bits = d.group === 'pitching'\n    ? [['ERA',S.era],['WHIP',S.whip],['K',S.so],['IP',S.ip],['K/9',S.k9]]\n    : [['AVG',S.avg],['OBP',S.obp],['SLG',S.slg],['OPS',S.ops],['HR',S.hr],['RBI',S.rbi],['SB',S.sb]];\n  const shown = bits.filter(([,v])=>v!=null && v!=='');\n  const hand = [d.bats?'B:'+d.bats:'', d.throws?'T:'+d.throws:''].filter(Boolean).join(' ');\n  if(shown.length) rows.push('<div class=\"statrow\"><div class=\"statlbl\">SEASON'+(d.position?' · '+esc(d.position):'')+\n    (hand?' · '+esc(hand):'')+' <span class=\"statsrc\">· MLB<\u002Fspan><\u002Fdiv><div class=\"statline\">'+\n    shown.map(([k,v])=>esc(k)+' <b>'+esc(v)+'<\u002Fb>').join(' · ')+'<\u002Fdiv><\u002Fdiv>');\n\n  const sp = d.splits || {};\n  const splitLine = (lbl,o)=> o ? esc(lbl)+' '+[o.avg!=null?'<b>'+esc(o.avg)+'<\u002Fb>':'',o.ops!=null?'OPS <b>'+esc(o.ops)+'<\u002Fb>':'',\n    o.hr!=null?'HR <b>'+esc(o.hr)+'<\u002Fb>':'',o.avgAgainst!=null?'AVG-against <b>'+esc(o.avgAgainst)+'<\u002Fb>':'',\n    o.so!=null?'K <b>'+esc(o.so)+'<\u002Fb>':''].filter(Boolean).join(' ') : '';\n  const splits = [splitLine('vs LHP', sp.vsLHP), splitLine('vs RHP', sp.vsRHP)].filter(Boolean);\n  if(splits.length) rows.push('<div class=\"statrow\"><div class=\"statlbl\">PLATOON SPLITS <span class=\"statsrc\">· MLB<\u002Fspan><\u002Fdiv>'+\n    splits.map(s=>'<div class=\"statline\">'+s+'<\u002Fdiv>').join('')+'<\u002Fdiv>');\n\n  const log = d.last10 || [];\n  if(log.length){\n    const cells = log.slice(0,10).map(g=>{\n      const v = d.group==='pitching' ? (g.so!=null?g.so:'–') : (g.h!=null?g.h:'–');\n      return '<div class=\"g5cell\"><b>'+esc(v)+'<\u002Fb>'+(g.opp?'<span>'+esc((g.home===false?'@':'vs ')+g.opp)+'<\u002Fspan>':'')+'<\u002Fdiv>';\n    }).join('');\n    rows.push('<div class=\"statrow\"><div class=\"statlbl\">LAST '+log.length+' '+\n      (d.group==='pitching'?'(strikeouts)':'(hits)')+' <span class=\"statsrc\">· MLB<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"g5 wrap\">'+cells+'<\u002Fdiv><\u002Fdiv>');\n  }\n  return rows.length ? rows.join('') : '<div class=\"statline\">No MLB numbers posted for this player yet.<\u002Fdiv>';\n}\nwireFolds(document.getElementById('searchResults'));\nwireFolds(document.getElementById('verdictLegs'));\n\n/* ---- Rate a Slip: upload -> parse -> review -> judge -> verdict ---- */\nconst sections = ['rateUpload','rateParsing','rateReview','rateJudging','rateResult'].reduce((o,id)=>(o[id]=document.getElementById(id),o),{});\nfunction showSection(id){ Object.keys(sections).forEach(k=>sections[k].hidden = k!==id); }\n\n// Re-encode uploads through a canvas before sending. Two reasons, both real:\n// \"Take Photo\" on an iPhone produces HEIC, which the vision API rejects outright\n// (it takes jpeg/png/gif/webp only — Safari decodes HEIC, so the canvas converts\n// it); and a 3x retina screenshot is ~2MB of base64 that OCRs no better than a\n// 1600px JPEG. Falls back to the raw file when this browser can't decode it.\nasync function fileToPayload(file){\n  const url = URL.createObjectURL(file);\n  try{\n    const img = await new Promise((ok,bad)=>{ const i=new Image();\n      i.onload=()=>ok(i); i.onerror=()=>bad(new Error('decode failed')); i.src=url; });\n    const MAX = 1600;\n    const scale = Math.min(1, MAX / Math.max(img.naturalWidth||1, img.naturalHeight||1));\n    const w = Math.max(1, Math.round((img.naturalWidth||1)*scale));\n    const h = Math.max(1, Math.round((img.naturalHeight||1)*scale));\n    const c = document.createElement('canvas'); c.width=w; c.height=h;\n    c.getContext('2d').drawImage(img, 0, 0, w, h);\n    const out = c.toDataURL('image/jpeg', 0.85);\n    if(out.length < 200) throw new Error('empty canvas');\n    return out;\n  }catch(err){\n    return await new Promise((ok,bad)=>{ const fr=new FileReader();\n      fr.onload=()=>ok(fr.result); fr.onerror=()=>bad(new Error('could not read that file'));\n      fr.readAsDataURL(file); });\n  }finally{ URL.revokeObjectURL(url); }\n}\n\nlet reviewLegs = [];\nlet parsedSlip = null;   // slipType/league/matchup/alreadySettled — judge-slip needs the whole object\n\ndocument.getElementById('rateFile').addEventListener('change', async function(e){\n  if(!e.target.files || !e.target.files[0]) return;\n  showSection('rateParsing');\n  try{\n    const file = e.target.files[0];\n    const image = await fileToPayload(file);\n    const r = await fetch('/api/parse-slip', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ image }) });\n    const res = await readJSON(r, 'parse-slip');\n    if(!r.ok || !res.ok) throw new Error(res.error || ('parse-slip ' + r.status));\n    parsedSlip = res.slip;\n    const settled = res.slip.alreadySettled;\n    document.getElementById('settledBanner').hidden = !settled;\n    const warnBanner = document.getElementById('warningsBanner');\n    if(res.warnings && res.warnings.length){ warnBanner.hidden=false; warnBanner.innerHTML='<span>⚠<\u002Fspan><span>'+res.warnings.map(esc).join('<br>')+'<\u002Fspan>'; }\n    else warnBanner.hidden=true;\n    // parse-slip has no \"unsure\" field; a line it couldn't read comes back null,\n    // which is exactly the leg worth flagging for review.\n    reviewLegs = (res.slip.legs||[]).map(l=>({...l, unsure: l.line == null || isNaN(l.line)}));\n    renderReviewLegs();\n    showSection('rateReview');\n  }catch(err){\n    showSection('rateUpload');\n    alert('Could not read that screenshot.\\n\\n' + (err.message || 'try another photo'));\n  }\n});\ndocument.getElementById('settledDismiss').addEventListener('click',()=>{ document.getElementById('settledBanner').hidden=true; });\n\nfunction renderReviewLegs(){\n  const wrap=document.getElementById('reviewLegs');\n  wrap.innerHTML = reviewLegs.map((l,i)=>`\n    <div class=\"eleg${l.unsure?' unsure':''}\">\n      <div class=\"eleg-top\">\n        <input type=\"text\" class=\"ename\" value=\"${esc(l.player)}\" data-i=\"${i}\" data-f=\"player\">\n        <input type=\"text\" class=\"eteam\" value=\"${esc(l.team)}\" data-i=\"${i}\" data-f=\"team\">\n        <button class=\"edel\" data-i=\"${i}\" title=\"remove leg\">✕<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"eleg-bottom\">\n        <input type=\"text\" class=\"estat\" value=\"${esc(l.stat)}\" data-i=\"${i}\" data-f=\"stat\">\n        <input type=\"number\" step=\"0.5\" class=\"eline\" value=\"${l.line}\" data-i=\"${i}\" data-f=\"line\">\n        <button class=\"eside\" data-i=\"${i}\">${l.pick==='under'?'▼ Under':'▲ Over'}<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"etierrow\">\n        <button class=\"etier${l.oddsType==='goblin'?' active':''}\" data-i=\"${i}\" data-tier=\"goblin\"><img src=\"${window.__resources.goblinImg}\" alt=\"\">Goblin<\u002Fbutton>\n        <button class=\"etier${l.oddsType==='standard'?' active':''}\" data-i=\"${i}\" data-tier=\"standard\"><img src=\"${window.__resources.standardImg}\" alt=\"\">Standard<\u002Fbutton>\n        <button class=\"etier${l.oddsType==='demon'?' active':''}\" data-i=\"${i}\" data-tier=\"demon\"><img src=\"${window.__resources.demonImg}\" alt=\"\">Demon<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('');\n  wrap.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',e=>{\n    const i=+e.target.dataset.i, f=e.target.dataset.f;\n    reviewLegs[i][f] = f==='line' ? parseFloat(e.target.value) : e.target.value;\n  }));\n  wrap.querySelectorAll('.eside').forEach(b=>b.addEventListener('click',e=>{\n    const i=+e.target.dataset.i; reviewLegs[i].pick = reviewLegs[i].pick==='under'?'over':'under'; renderReviewLegs();\n  }));\n  wrap.querySelectorAll('.etier').forEach(b=>b.addEventListener('click',e=>{\n    const i=+e.target.dataset.i; reviewLegs[i].oddsType = e.target.dataset.tier; renderReviewLegs();\n  }));\n  wrap.querySelectorAll('.edel').forEach(b=>b.addEventListener('click',e=>{\n    reviewLegs.splice(+e.target.dataset.i,1); renderReviewLegs();\n  }));\n}\n\ndocument.getElementById('rateThisBtn').addEventListener('click', async ()=>{\n  if(!reviewLegs.length){ alert('Add at least one leg first.'); return; }\n  showSection('rateJudging');\n  const pb=document.getElementById('judgePbar'); let elapsed=0; const typicalMs=35000;\n  const tick=setInterval(()=>{ elapsed+=800; pb.style.width=Math.min(94,(elapsed/typicalMs)*100+8)+'%'; },800);\n  try{\n    const slip = Object.assign({}, parsedSlip || {}, {\n      legs: reviewLegs.map(({unsure, ...leg}) => leg),   // \"unsure\" is ours, not the API's\n      legCount: reviewLegs.length,\n    });\n    const res = await runJob('judge-slip', { slip }, (text, elapsed)=>{\n      document.getElementById('judgeStepText').textContent = text + '  ·  ' + Math.round(elapsed/1000) + 's';\n    }, 5*60*1000);\n    clearInterval(tick); pb.style.width='100%';\n    runReport('rate slip', res);\n    renderVerdict(res);\n    loadSlipMath(res);\n    showSection('rateResult');\n  }catch(err){\n    clearInterval(tick);\n    showSection('rateReview');\n    alert('Grading failed.\\n\\n' + (err.message || 'try again'));\n  }\n});\n\nfunction renderVerdict(res){\n  const ds=res.dataStatus;\n  const dsBanner=document.getElementById('dataStatusBanner');\n  if(ds){\n    const bits=[];\n    if(!ds.matchedLegs) bits.push('No legs matched a live projection — graded on player profile alone, with probabilities widened toward 50%. Read these as soft.');\n    else if(ds.matchedLegs < ds.totalLegs) bits.push(ds.matchedLegs+' of '+ds.totalLegs+' legs matched a live projection; the rest were graded on profile alone.');\n    // Tier corrections are never silent: goblin and demon sit at opposite ends of\n    // the payout table, so a fixed one changes the EV math you're about to read.\n    if(ds.tierCorrections){\n      const named = (ds.tierFixes||[]).map(f=>f.player+' '+f.was+'→'+f.now).join(', ');\n      bits.push('Corrected '+ds.tierCorrections+' tier'+(ds.tierCorrections===1?'':'s')+\n        ' against the live board'+(named?' ('+named+')':'')+' — the screenshot read them differently.');\n    }\n    if(ds.leagueSupported === false) bits.push('Props-only league — no standings or odds research attached.');\n    if(ds.bookLineStatus && ds.bookLineStatus !== 'ok') bits.push('No DraftKings line to compare against — the judge rates that gap its sharpest signal.');\n    if(ds.loggedForCalibration) bits.push(ds.loggedForCalibration+' leg'+(ds.loggedForCalibration===1?'':'s')+' logged for calibration; results fill in after the games settle.');\n    dsBanner.hidden = !bits.length;\n    dsBanner.classList.toggle('thin', !ds.matchedLegs);\n    dsBanner.textContent = bits.join(' ');\n  } else dsBanner.hidden=true;\n\n  document.getElementById('verdictHead').innerHTML =\n    '<div class=\"verdict '+esc(res.slip.overall||'coinflip')+'\">'+esc(String(res.slip.overall||'—').toUpperCase())+'<\u002Fdiv>'+\n    (res.slip.overallReasoning?'<div style=\"font-family:var(--mono);font-size:11px;color:var(--ink);margin-top:10px;line-height:1.6\">'+prose(res.slip.overallReasoning)+'<\u002Fdiv>':'')+\n    (res.slip.weakestLeg?'<div style=\"font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:10px;line-height:1.6\">'+\n    'Weakest leg: <span style=\"color:var(--ink)\">'+prose(res.slip.weakestLeg)+'<\u002Fspan><\u002Fdiv>':'')+\n    (res.slip.correlationFlag?'<div style=\"font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:6px;line-height:1.6;padding:9px 10px;border:1px solid var(--line);border-radius:4px\">'+prose(res.slip.correlationFlag)+'<\u002Fdiv>':'');\n\n  document.getElementById('verdictLegs').innerHTML = res.legs.map(l=>{\n    // Same raw-numbers panel the board gets — the facts the judge saw, so a\n    // surprising verdict can be checked against them on the spot.\n    const sHtml = statsHtml(l, {});\n    return `\n    <div class=\"leg\">\n      ${avatarHtml(l.player, l.image)}\n      <div class=\"info\">\n        <div class=\"name\">${tierIcon(l.oddsType)}${esc(l.player)}<\u002Fdiv>\n        <div class=\"team\">${esc(l.team)}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stat-right\">\n        <div class=\"stat\">${esc(l.stat)} <span class=\"side ${esc(l.pick||'over')}\">${esc(l.pick||'over')}<\u002Fspan> ${esc(l.line)}<\u002Fdiv>\n        <div class=\"pct ${verdictOf(l)}\">${toPct(l.prob) == null ? '—' : toPct(l.prob) + '%'}<\u002Fdiv>\n        <div class=\"bar ${verdictOf(l)}\"><i style=\"width:${toPct(l.prob) || 0}%\"><\u002Fi><\u002Fdiv>\n      <\u002Fdiv>\n      ${l.key_risk ? '<div class=\"risk\">' + prose(l.key_risk) + '<\u002Fdiv>' : ''}\n      ${l.reasoning ? '<div class=\"reason\">' + prose(l.reasoning) + '<\u002Fdiv>' : ''}\n      ${sHtml ? '<div class=\"whyrow\"><button class=\"whybtn\" type=\"button\" data-panel=\"stats\" data-lbl=\"stats\" aria-expanded=\"false\">stats ↓<\u002Fbutton><\u002Fdiv><div class=\"why\" data-panel=\"stats\" hidden>' + sHtml + '<\u002Fdiv>' : ''}\n    <\u002Fdiv>`;\n  }).join('');\n}\n\n/* ---- slip math: the judge grades legs one at a time; this is the parlay arithmetic.\n   /api/bet-finder-size runs the hit distribution against real PrizePicks payout\n   tables (per tier, mixed slips priced too) and returns EV per dollar. The judge is\n   deliberately not allowed to do this math — it's deterministic, so it's computed. ---- */\nasync function loadSlipMath(res){\n  const box = document.getElementById('slipMath');\n  box.hidden = true; box.innerHTML = '';\n  const legs = (res.legs||[]).filter(l=>l.prob!=null).map(l=>({ prob:Number(l.prob), oddsType:l.oddsType||'standard' }));\n  if(legs.length < 2) return;   // no parlay math on a single leg\n  let d;\n  try{\n    const r = await fetch('/api/bet-finder-size',{method:'POST',headers:{'Content-Type':'application/json'},\n      body: JSON.stringify({ legs, bankroll:100, floor:0 })});\n    d = await readJSON(r,'bet-finder-size');\n    if(!r.ok || d.error) return;   // sizing is a bonus — never block the verdict on it\n  }catch(e){ return; }\n\n  const dist = d.hitDistribution||[];\n  const n = legs.length;\n  const allHit = dist[n]!=null ? Math.round(dist[n]*100) : null;\n  const rows=[];\n  const ev = (e)=>{ if(!e) return null; const v=e.evPerDollar; // edge: EV-1 per $1\n    return '<span class=\"'+(v>0?'evpos':'evneg')+'\">'+(v>0?'+':'')+Math.round(v*100)+'%<\u002Fspan>'\n      + (e.stake===0?' <span style=\"color:var(--faint)\">· no bet<\u002Fspan>':''); };\n  if(d.entries&&d.entries.power) rows.push(['POWER (all must hit)', ev(d.entries.power)]);\n  if(d.entries&&d.entries.flex)  rows.push(['FLEX (partial pays)', ev(d.entries.flex)]);\n\n  // Independence is the one assumption in this math; say so, louder when the judge\n  // itself flagged correlated legs or the grade was profile-only.\n  const flag = String((res.slip&&res.slip.correlationFlag)||'');\n  const correlated = flag && !/no correlation|none|independent/i.test(flag);\n  const thin = res.dataStatus && !res.dataStatus.matchedLegs;\n  let note = 'Assumes independent legs.';\n  if(correlated) note += ' The judge flagged same-game correlation on this slip — this math is optimistic.';\n  if(thin) note += ' Built on profile-only probabilities (no legs matched a live projection) — treat as rough.';\n\n  box.innerHTML =\n    '<div class=\"smh\">Slip math · '+n+' legs'+(d.mixed?' · mixed tiers (estimate)':'')+'<\u002Fdiv>'+\n    (allHit!=null?'<div class=\"smrow\"><span>P(all '+n+' hit)<\u002Fspan><b>'+allHit+'%<\u002Fb><\u002Fdiv>':'')+\n    '<div class=\"dist\">'+dist.map((p,k)=>'<span class=\"dchip\">'+k+'✓ '+Math.round(p*100)+'%<\u002Fspan>').reverse().join('')+'<\u002Fdiv>'+\n    rows.map(r=>'<div class=\"smrow\"><span>'+r[0]+'<\u002Fspan><b>'+r[1]+'<\u002Fb><\u002Fdiv>').join('')+\n    (d.recommended?'<div class=\"smrow\"><span>better entry<\u002Fspan><b>'+esc(d.recommended)+'<\u002Fb><\u002Fdiv>':'')+\n    '<div class=\"smnote'+((correlated||thin)?' amber':'')+'\">'+esc(note)+' EV per $1 staked, from the real payout table for this tier mix.<\u002Fdiv>';\n  box.hidden = false;\n}\n\n/* ---- scoreboard: the record, from the same data calibration scores ---- */\nlet SCORE_LOADED = false;\nasync function loadScore(){\n  if(SCORE_LOADED) return;\n  const bar = document.getElementById('scoreBar');\n  try{\n    const d = await getJSON('/api/calibration?format=json','calibration');\n    if(!d || !d.graded){ SCORE_LOADED = true; bar.hidden=false;\n      bar.innerHTML = '<span>No graded picks yet — the record builds after tonight\\'s games settle.<\u002Fspan>'; return; }\n    const pl = d.playsLeans||{n:0,hits:0};\n    const early = d.graded < 50;\n    const bits = [];\n    if(pl.n) bits.push('RECORD (plays+leans) <b>'+pl.hits+'–'+(pl.n-pl.hits)+'<\u002Fb> · <b>'+Math.round(pl.hits/pl.n*100)+'%<\u002Fb>');\n    if(d.brier!=null) bits.push('BRIER <b>'+d.brier.toFixed(3)+'<\u002Fb>'+(early?' <span class=\"early\">n='+d.graded+' — early<\u002Fspan>':''));\n    const bs = d.bySource||{};\n    if(bs.board&&bs.slip) bits.push('BOARD <b>'+(bs.board.brierSum/bs.board.n).toFixed(2)+'<\u002Fb> · SLIP <b>'+(bs.slip.brierSum/bs.slip.n).toFixed(2)+'<\u002Fb>');\n    // Per league, biggest sample first. One blended number can't tell you the\n    // engine is sharp on baseball and guessing at tennis; these can.\n    const lgs = Object.entries(d.leagues||{}).filter(([,v])=>v.graded>0)\n      .sort((a,b)=>b[1].graded-a[1].graded).slice(0,5);\n    if(lgs.length) bits.push(lgs.map(([lg,v])=>{\n      const pl2 = v.playsLeans||{n:0,hits:0};\n      const rate = pl2.n ? Math.round(pl2.hits/pl2.n*100)+'%' : '—';\n      return esc(lg.toUpperCase())+' <b>'+rate+'<\u002Fb>'+\n        (v.brier!=null?' <span style=\"color:var(--faint)\">'+v.brier.toFixed(2)+'<\u002Fspan>':'')+\n        (v.graded<50?' <span class=\"early\">n='+v.graded+'<\u002Fspan>':'');\n    }).join(' · '));\n    bits.push('<a href=\"/api/calibration\" style=\"color:var(--faint)\">full calibration ↗<\u002Fa>');\n    bar.innerHTML = bits.map(b=>'<span>'+b+'<\u002Fspan>').join('');\n    bar.hidden = false;\n    SCORE_LOADED = true;\n  }catch(e){ /* left unlatched so the ↻ refresh button retries it */ }\n}\n\ndocument.getElementById('rateResetBtn').addEventListener('click', ()=>{\n  document.getElementById('rateFile').value='';\n  reviewLegs=[];\n  document.getElementById('slipMath').hidden = true;\n  showSection('rateUpload');\n});\n\n/* ---- Today's Picks ledger ---- */\nlet LEDGER = [];\n\n/* Build a slip out of the day's board.\n   Deliberately the same rules the server uses, for the same reasons:\n     - ranked by EDGE, never raw probability. A goblin at 80% needs 79.4% a leg\n       to break even and a standard at 65% needs 59.5%; sorting on the percentage\n       floats the worst-paying tier to the top of every slip.\n     - a prop appears once however many lines of it are on the board — two lines\n       of one prop are NESTED, not independent, and PrizePicks won't take both.\n     - at most two legs per player, since props on one player fail together.\n     - one pass preferring unseen games before filling, because a slip stacked on\n       a single game is one weather delay from zero.\n   Settled picks are excluded: yesterday's winner is not a bet.\n   Unpriced sides are excluded too — an under on a goblin or demon line is\n   placeable but its payout is not known, so it cannot honestly be sized. */\nfunction ledgerRecommend(picks, n){\n  const live = picks.filter(p => p.hit == null && sidePriced(p));\n  const ranked = live.slice().sort((a,b)=> (edgeRank(b)-edgeRank(a)) || (probOf(b)-probOf(a)));\n  const out=[], perPlayer={}, props=new Set(), games=new Set();\n  for(const spreadPass of [true,false]){\n    for(const p of ranked){\n      if(out.length>=n) break;\n      const pk=propKeyOf(p); if(props.has(pk)) continue;\n      const pl=String(p.player||'').toLowerCase();\n      if((perPlayer[pl]||0)>=2) continue;\n      const g=String(p.matchup||p.team||'');\n      if(spreadPass && games.has(g)) continue;\n      out.push(p); props.add(pk); perPlayer[pl]=(perPlayer[pl]||0)+1; games.add(g);\n    }\n  }\n  return out;\n}\n\nfunction renderLedgerRec(){\n  const el=document.getElementById('ledgerRec');\n  if(!el) return;\n  const n=Math.max(2,Math.min(6,parseInt(document.getElementById('legVal')?.textContent,10)||3));\n  const legs=ledgerRecommend(LEDGER, n);\n  // PrizePicks takes a minimum of two. Offering a one-leg \"slip\" would be\n  // offering something that cannot be placed.\n  if(legs.length<2){ el.innerHTML=''; return; }\n  const rows=legs.map(l=>{\n    const eg=edgeOf(l);\n    return '<div class=\"recline\"><div class=\"rl-name\">'+tierIcon(l.oddsType)+esc(l.player)+'<\u002Fdiv>'+\n      '<div class=\"rl-stat\">'+esc(l.statDisplay||l.stat)+' <span class=\"side '+esc(l.side||l.pick||'over')+'\">'+\n        esc(l.side||l.pick||'over')+'<\u002Fspan> '+esc(l.line)+'<\u002Fdiv>'+\n      '<div class=\"rl-p\">'+(toPct(probOf(l))||'—')+'%<\u002Fdiv><\u002Fdiv>';\n  }).join('');\n  el.innerHTML='<div class=\"recbox\"><div class=\"statlbl\">SLIP FROM TODAY\\u2019S BOARD<\u002Fdiv>'+rows+\n    '<div class=\"recwhy\">Ranked by edge over each tier\\u2019s break-even, one prop per player-stat, at most two '+\n    'legs per player, spread across games before doubling up. Settled picks and sides whose payout '+\n    'isn\\u2019t known are left out. Load it to see what it actually pays \\u2014 the numbers come from the '+\n    'real PrizePicks tables, not from these percentages.<\u002Fdiv>'+\n    '<button class=\"recload\" id=\"ledgerRecLoad\">LOAD INTO SLIP BUILDER \\u2192<\u002Fbutton><\u002Fdiv>';\n  document.getElementById('ledgerRecLoad').addEventListener('click', ()=>{\n    tray = legs.slice(0, MAX_LEGS).map(l=>poolAdd(l));\n    renderLedger(); renderBoardResults(); renderTray();\n    document.getElementById('tabBtnSearch').click();\n    setTimeout(()=>document.getElementById('slipTray')?.scrollIntoView({behavior:'smooth',block:'center'}),60);\n  });\n}\n\nfunction renderLedger(){\n  const body=document.getElementById('ledgerBody');\n  if(!body || !LEDGER.length) return;\n  body.innerHTML = LEDGER.map(p=>{\n    poolAdd(p);\n    const v = verdictOf(p), pc = toPct(probOf(p));\n    const side = p.side||p.pick||'over';\n    // hit is null until the game settles — pending, won and lost must not look alike.\n    const settled = p.hit === true ? '<span class=\"settled win\">HIT<\u002Fspan>'\n                  : p.hit === false ? '<span class=\"settled miss\">MISS<\u002Fspan>' : '';\n    const eg = edgeOf(p);\n    const edgeHtml = eg==null\n      ? '<span class=\"edgeval unpriced\">price ?<\\u002Fspan>'\n      : '<span class=\"edgeval '+(eg>=0.05?'good':eg>=0.02?'ok':'thin')+'\">'+(eg>=0?'+':'')+(eg*100).toFixed(1)+'pp<\\u002Fspan>';\n    // A settled pick is history, not something to add to a slip.\n    const add = p.hit==null\n      ? '<button class=\"addbtn'+(trayHas(p)?' on':'')+'\" type=\"button\" data-add=\"'+esc(legKey(p))+'\">'+\n        (trayHas(p)?'\\u2713 in slip':'+ slip')+'<\u002Fbutton>' : '';\n    return '<div class=\"leg\">'+avatarHtml(p.player, p.image)+\n      '<div class=\"info\"><div class=\"name\">'+esc(p.player)+'<\u002Fdiv><div class=\"team\" style=\"color:var(--amb)\">'+esc(p.team)+'<\u002Fdiv><\u002Fdiv>'+\n      '<div class=\"stat-right\"><div class=\"stat\" style=\"font-weight:700;color:var(--ink);font-family:var(--disp);font-size:13px;text-decoration:underline;text-decoration-color:var(--line)\">'+esc(p.stat)+'<\u002Fdiv>'+\n      '<div style=\"font-family:var(--mono);font-size:13px;color:var(--dim);margin-bottom:8px\"><span style=\"color:'+(side==='over'?'var(--grn)':'var(--red)')+'\">'+esc(p.line)+'<\u002Fspan> '+esc(side).replace(/^./,c=>c.toUpperCase())+'<\u002Fdiv>'+\n      '<div style=\"display:flex;align-items:center;gap:8px;justify-content:flex-end\">'+\n      settled+\n      '<span class=\"pct '+v+'\" style=\"font-size:14px\">'+(pc==null?'—':pc+'%')+'<\u002Fspan>'+\n      '<span class=\"verdict '+v+'\" style=\"font-size:10px;padding:3px 9px\">'+v.charAt(0).toUpperCase()+v.slice(1)+'<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"edgerow\">'+edgeHtml+'<\u002Fdiv><\u002Fdiv>'+\n      (add?'<div class=\"whyrow\">'+add+'<\u002Fdiv>':'')+'<\u002Fdiv>';\n  }).join('');\n  renderLedgerRec();\n}\n\nlet ledgerLoaded=false;\nasync function loadLedger(){\n  loadScore();\n  const body=document.getElementById('ledgerBody');\n  body.innerHTML='<div class=\"skel\"><\u002Fdiv><div class=\"skel\"><\u002Fdiv><div class=\"skel\"><\u002Fdiv>';\n  try{\n    // play AND lean: plays alone are too thin a pool to build a slip from, and\n    // the verdict badge already tells the two apart on the row.\n    const res = await getJSON('/api/top-picks?format=json&verdict=play,lean', 'top-picks');\n    if(!res.picks || !res.picks.length){ LEDGER=[]; document.getElementById('ledgerRec').innerHTML='';\n      body.innerHTML='<div class=\"empty\">No slate today. Run a scan to build the ledger.<\u002Fdiv>'; return; }\n    LEDGER = res.picks;\n    renderLedger();\n  }catch(e){\n    body.innerHTML='<div class=\"errbox\">\\u26a0 '+esc(e.message||'could not load ledger')+'<\u002Fdiv>';\n  }\n}\ndocument.getElementById('ledgerRefresh').addEventListener('click', loadLedger);\ndocument.getElementById('ledgerBody').addEventListener('click', e=>{\n  const b=e.target.closest('.addbtn');\n  if(b) trayToggle(b.dataset.add);\n});\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"</script>
