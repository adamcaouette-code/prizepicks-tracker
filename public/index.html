  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

 var(--line)}\n  .brandband img{width:100%;max-width:236px;height:auto;display:block}\n  .badge{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--ink);border:1px solid var(--line);padding:5px 11px;border-radius:20px}\n\n  .hero{position:relative;padding:16px 28px;overflow:hidden;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}\n  .hero .wave{position:absolute;inset:0;opacity:.35;pointer-events:none}\n  .hero-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--faint);text-transform:uppercase;margin-bottom:4px;position:relative}\n  .hero h1{font-family:var(--cond);font-weight:700;font-size:20px;line-height:1;text-transform:uppercase;letter-spacing:.01em;position:relative}\n  .hero-sub{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.5;max-width:220px;margin-top:6px;position:relative}\n  .circle-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:13px;position:relative;cursor:pointer;transition:border-color .15s;flex:none;background:none}\n  .circle-btn:hover{border-color:var(--ink)}\n\n  /* tabs */\n  .tabs{display:flex;border-bottom:1px solid var(--line)}\n  .tab{flex:1;background:none;border:none;color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:14px 6px;cursor:pointer;border-bottom:2px solid transparent;transition:.15s}\n  .tab[aria-selected=\"true\"]{color:var(--ink);border-bottom-color:var(--ink)}\n  .tabpanel{}\n  .tabpanel[hidden]{display:none}\n\n  section{padding:22px 28px}\n  .label{display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase;margin-bottom:18px}\n  .label b{color:var(--dim);font-weight:500;letter-spacing:.1em}\n  .label .hr{flex:1;height:1px;background:var(--line)}\n\n  .row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}\n  .row:first-of-type{border-top:none}\n  .row .k{font-size:13px;font-weight:500;color:var(--ink)}\n  .row .sub{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}\n\n  .stepper{display:flex;align-items:center;gap:16px}\n  .stepper button{background:none;border:none;color:var(--dim);font-size:16px;font-weight:300;cursor:pointer;width:20px;line-height:1;transition:color .15s}\n  .stepper button:hover{color:var(--ink)}\n  .stepper .val{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.02em;min-width:16px;text-align:center}\n\n  .hscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:2px;cursor:grab;scrollbar-width:none;-ms-overflow-style:none}\n  .hscroll::-webkit-scrollbar{display:none;width:0;height:0}\n  .leaguechip{flex:none;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--faint);background:none;border:1px solid var(--line);border-radius:20px;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:.15s;display:flex;align-items:center;gap:6px}\n  .leaguechip.active{color:var(--ink);border-color:var(--ink)}\n  .leaguechip .flag{font-size:8px;color:var(--amb);border:1px solid var(--amb);border-radius:3px;padding:1px 4px;letter-spacing:.05em;cursor:pointer;margin-left:6px}\n  .leagueinfo{font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.6;border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-top:12px}\n  .leagueinfo[hidden]{display:none}\n  .leagueinfo b{color:var(--amb)}\n\n  .propscroll{display:flex;gap:22px;overflow-x:auto;padding-bottom:2px;cursor:grab;scrollbar-width:none;-ms-overflow-style:none}\n  .propscroll::-webkit-scrollbar{display:none;width:0;height:0}\n  .propchip{flex:none;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.03em;color:var(--faint);background:none;border:none;padding:0 0 6px;border-bottom:1.5px so ht:2px}\n  .tmark img{width:100%;height:100%;object-fit:contain;opacity:.9}\n  /* An inactive player is not a bet. The card says so before you can add it. */\n  .injflag{flex:0 0 100%;width:100%;margin-top:8px;font-family:var(--mono);font-size:10px;\n    color:var(--red);border:1px solid rgba(201,123,114,.4);border-radius:4px;padding:6px 9px;text-align:left}\n  .leg.hurt .avatar{opacity:.45}\n  .leg.hurt .name{color:var(--dim)}\n  .voidbox{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid rgba(201,168,106,.35);\n    border-radius:4px;padding:10px 12px;margin-bottom:14px;line-height:1.7}\n  .voidbox b{color:var(--amb)}\n  .voidex{color:var(--faint);margin-top:6px}\n  .injbox{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);\n    border-radius:4px;padding:10px 12px;margin-bottom:14px;line-height:1.7}\n  .injbox b{color:var(--ink)}\n  .injbox .out{color:var(--red)}\n  /* slip math (EV) panel under the verdict */\n  #slipMath{margin-top:18px;border:1px solid var(--line);border-radius:6px;padding:14px}\n  #slipMath .smh{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}\n  #slipMath .smrow{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;padding:5px 0}\n  #slipMath .smrow b{font-variant-numeric:tabular-nums}\n  #slipMath .dist{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}\n  #slipMath .dchip{font-family:var(--mono);font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:3px 7px;font-variant-numeric:tabular-nums}\n  #slipMath .smnote{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:10px;line-height:1.6}\n  #slipMath .smnote.amber{color:var(--amb,#e2c97e)}\n  .evpos{color:var(--grn)} .evneg{color:var(--red)}\n  /* scoreboard strip on Today's Picks */\n  #scoreBar{border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:16px;\n    font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;flex-wrap:wrap;gap:6px 18px}\n  #scoreBar b{color:var(--ink);font-variant-numeric:tabular-nums}\n  #scoreBar .early{color:var(--amb,#e2c97e)}\n  .banner{font-family:var(--mono);font-size:10px;line-height:1.6;color:var(--amb);border:1px solid var(--amb);border-radius:4px;padding:10px 12px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}\n  .banner button{background:none;border:none;color:var(--amb);font-size:14px;cursor:pointer;line-height:1;flex:none}\n  .banner.data{color:var(--dim);border-color:var(--line)}\n\n  .upload-box{border:1px dashed var(--line);border-radius:6px;padding:30px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;text-align:center}\n  .upload-box:hover{border-color:var(--dim)}\n  .upload-box .u-title{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink);text-transform:uppercase}\n  .upload-box .u-sub{font-family:var(--mono);font-size:10px;color:var(--faint)}\n\n  .step{display:flex;align-items:center;gap:10px;margin-bottom:14px}\n  .spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;flex:none}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  .step-text{font-family:var(--mono);font-size:11px;color:var(--dim)}\n  .pbar{height:2px;background:var(--line);position:relative;margin-bottom:20px}\n  .pbar i{position:absolute;inset:0;background:var(--ink);transition:width .3s linear}\n  .skel{height:56px;border-radius:4px;background:#0d0d0d;border:1px solid var(--line);margin-bottom:8px;animation:fade 1.4s ease-in-out infinite}\n  @keyframes fade{0%,100%{opacity:.3}50%{opacity:.7}}\n\n  .empty,.errbox{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center;padding:30px 10px;line-height:1.7}\n  .errbox{color:var(--red)}\n  .n{font-family:var(--mono);font-size:9px;color:var(--faint)}\n\n  .pick{padding:13px 0;border-top:1px solid var(--line)}\n  .pick:first-of-type{border-top:none}\n  .pick-top{display:flex;justify-content:space-between;align-items:baseline}\n  .pick-name{font-size:13px;font-weight:500}\n  .pick-hit{font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:2px 7px;border-radius:10px;border:1px solid var(--line);color:var(--faint)}\n  .pick-hit.hit{color:var(--grn);border-color:var(--grn)}\n  .pick-hit.miss{color:var(--red);border-color:var(--red)}\n\n  .devlinks{display:flex;gap:8px;padding:0 28px 6px}\n  .devlinks a{flex:1;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:9px 4px;text-decoration:none}\n  .devlinks a:hover{color:var(--ink);border-color:var(--dim)}\n  .reportbox{margin:0 28px 6px;padding:11px 12px;border:1px solid var(--line);border-radius:4px;\n    font-family:var(--mono);font-size:10px;line-height:1.65;color:var(--dim);\n    white-space:pre;overflow-x:auto;-webkit-user-select:all;user-select:all}\n  .foot{font-family:var(--mono);font-size:9px;color:var(--faint);text-align:center;padding:14px 28px 26px;letter-spacing:.04em}\n  /* live slate size on a league/prop chip */\n  .leaguechip .lgn,.propchip .lgn{margin-left:7px;font-size:10px;opacity:.6;font-variant-numeric:tabular-nums}\n  /* settled ledger rows must not read like pending ones */\n  .settled{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.08em;padding:3px 7px;border-radius:3px}\n  .settled.win{background:rgba(80,220,150,.16);color:var(--grn)}\n  .settled.miss{background:rgba(255,90,80,.16);color:var(--red)}\n  /* thin-data grades shouldn't look like fully researched ones */\n  .banner.data.thin{border-color:var(--amb);color:var(--amb)}\n<\u002Fstyle><\u002Fhead>\n<body>\n<div class=\"frame\">\n  <header>\n    <div class=\"wm\">Atom<span>Bets<\u002Fspan><\u002Fdiv>\n    <div class=\"badge\" id=\"slateBadge\">— slate —<\u002Fdiv>\n  <\u002Fheader>\n\n  <div class=\"brandband\"><img src=\"/logo.png\" alt=\"AtomBets\" width=\"640\" height=\"509\"><\u002Fdiv>\n\n  <div class=\"hero\">\n    <svg class=\"wave\" viewBox=\"0 0 460 70\" preserveAspectRatio=\"none\"><path d=\"M0 20 Q60 5 120 20 T240 20 T360 20 T460 20\" fill=\"none\" stroke=\"rgba(255,255,255,.08)\" stroke-width=\"1\"><\u002Fpath><path d=\"M0 45 Q60 60 120 45 T240 45 T360 45 T460 45\" fill=\"none\" stroke=\"rgba(255,255,255,.06)\" stroke-width=\"1\"><\u002Fpath><\u002Fsvg>\n    <div>\n      <div class=\"hero-eyebrow\">Slip Terminal<\u002Fdiv>\n      <h1>Find Your Edge<\u002Fh1>\n      <div class=\"hero-sub\">Grade every leg before you play it.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"circle-btn\">↓<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"tabs\" role=\"tablist\">\n    <button class=\"tab\" id=\"tabBtnRate\" role=\"tab\" aria-selected=\"false\" aria-controls=\"tabRate\">Rate a Slip<\u002Fbutton>\n    <button class=\"tab\" id=\"tabBtnSearch\" role=\"tab\" aria-selected=\"true\" aria-controls=\"tabSearch\">Search<\u002Fbutton>\n    <button class=\"tab\" id=\"tabBtnToday\" role=\"tab\" aria-selected=\"false\" aria-controls=\"tabToday\">Today's Picks<\u002Fbutton>\n    <button class=\"tab\" id=\"tabBtnSlips\" role=\"tab\" aria-selected=\"false\" aria-controls=\"tabSlips\">My Slips<\u002Fbutton>\n  <\u002Fdiv>\n\n  <!-- ============ RATE A SLIP ============ -->\n  <div id=\"tabRate\" class=\"tabpanel\" role=\"tabpanel\" hidden=\"\">\n    <section id=\"rateUpload\">\n      <div class=\"label\"><b>Upload<\u002Fb><span class=\"hr\"><\u002Fspan><\u002Fdiv>\n      <label class=\"upload-box\">\n        <!-- No capture attribute: capture=\"environment\" makes iOS open the camera straight\n             away and hides Photo Library / Files, but a PrizePicks slip is a screenshot —\n             there is nothing to point a camera at. Omitting it gives the full picker,\n             camera included. accept covers HEIC/screenshots as image/*. -->\n        <input type=\"file\" accept=\"image/*\" id=\"rateFile\" style=\"display:none\">\n        <div class=\"u-title\">Tap to upload a slip screenshot<\u002Fdiv>\n        <div class=\"u-sub\">JPG or PNG · camera or library<\u002Fdiv>\n      <\u002Flabel>\n    <\u002Fsection>\n\n    <section id=\"rateParsing\" hidden=\"\">\n      <div class=\"label\"><b>Reading Slip<\u002Fb><span class=\"hr\"><\u002Fspan><\u002Fdiv>\n      <div class=\"step\"><div class=\"spin\"><\u002Fdiv><div class=\"step-text\" id=\"parseStepText\">Reading slip image…<\u002Fdiv><\u002Fdiv>\n      <div class=\"skel\"><\u002Fdiv><div class=\"skel\"><\u002Fdiv><div class=\"skel\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"rateReview\" hidden=\"\">\n      <div class=\"label\"><b>Review Legs<\u002Fb><span class=\"hr\"><\u002Fspan><\u002Fdiv>\n      <div id=\"settledBanner\" class=\"banner\" hidden=\"\">\n        <span>⚠<\u002Fspan>\n        <span style=\"flex:1\">This slip is already graded — showing recognition only, no live prediction.<\u002Fspan>\n        <button id=\"settledDismiss\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div id=\"warningsBanner\" class=\"banner\" hidden=\"\"><\u002Fdiv>\n      <div id=\"reviewLegs\"><\u002Fdiv>\n      <button class=\"run\" id=\"rateThisBtn\" style=\"margin-top:16px\">LOOKS RIGHT — RATE THIS SLIP →<\u002Fbutton>\n    <\u002Fsection>\n\n    <section id=\"rateJudging\" hidden=\"\">\n      <div class=\"label\"><b>Grading Slip<\u002Fb><span class=\"hr\"><\u002Fspan><\u002Fdiv>\n      <div class=\"step\"><div class=\"spin\"><\u002Fdiv><div class=\"step-text\" id=\"judgeStepText\">Matching legs to live projections…<\u002Fdiv><\u002Fdiv>\n      <div class=\"pbar\"><i id=\"judgePbar\" style=\"width:0%\"><\u002Fi><\u002Fdiv>\n      <div class=\"skel\"><\u002Fdiv><div class=\"skel\"><\u002Fdiv><div class=\"skel\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <section id=\"rateResult\" hidden=\"\">\n      <div class=\"label\"><b>Verdict<\u002Fb><span class=\"hr\"><\u002Fspan><\u002Fdiv>\n      <div id=\"dataStatusBanner\" class=\"banner data\" hidden=\"\"><\u002Fdiv>\n      <div id=\"verdictHead\" style=\"margin-bottom:14px\"><\u002Fdiv>\n      <div id=\"verdictLegs\"><\u002Fdiv>\n      <div id=\"slipMath\" hidden><\u002Fdiv>\n      <button class=\"run ghost\" id=\"rateResetBtn\" style=\"margin-top:16px\">↺ START OVER<\u002Fbutton>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <!-- ============ SEARCH / BOARD SETUP ============ -->\n  <div id=\"tabSearch\" class=\"tabpanel\" role=\"tabpanel\">\n    <section>\n      <div class=\"label\"><b>League<\u002Fb><span class=\"hr\"><\u002Fspan><\u002Fdiv>\n      <div class=\"hscroll\" id=\"leagueScroll\"><\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding-top:0\">\n      <div class=\"label\"><b>Board Setup<\u002Fb><span class=\"hr\"><\u002Fspan><\u002Fdiv>\n      <div class=\"leagueinfo\" id=\"leagueInfo\" hidden=\"\"><\u002Fdiv>\n      <div class=\"row\">\n        <div><div class=\"k\">Parlay Legs<\u002Fdiv><\u002Fdiv>\n        <div class=\"stepper\"><button id=\"legDown\">−<\u002Fbutton><span class=\"val\" id=\"legVal\">03<\u002Fspan><button id=\"legUp\">+<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"row\" style=\"display:block\">\n        <div class=\"k\" style=\"margin-bottom:14px\">Prop Filter<\u002Fdiv>\n        <div class=\"propscroll\" id=\"propScroll\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding-top:0\">\n      <div class=\"label\"><b>Side<\u002Fb><span class=\"hr\"><\u002Fspan><\u002Fdiv>\n      <div class=\"sides\" id=\"sides\">\n        <button class=\"sidebtn active\" type=\"button\" data-v=\"both\">BOTH<\u002Fbutton>\n        <button class=\"sidebtn\" type=\"button\" data-v=\"over\">OVERS<\u002Fbutton>\n        <button class=\"sidebtn\" type=\"button\" data-v=\"under\">UNDERS<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"sidenote\">An under is just the other half of the same read — a prop the\n        engine gives a 30% chance of going over is a 70% under. <b>Both<\u002Fb> shows whichever\n        side is the bet.<\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding-top:0\">\n      <div class=\"label\"><b>Judge<\u002Fb><span class=\"hr\"><\u002Fspan><\u002Fdiv>\n      <div class=\"sides\" id=\"judges\">\n        <button class=\"sidebtn active\" type=\"button\" data-v=\"aphrodite\">APHRODITE<\u002Fbutton>\n        <button class=\"sidebtn\" type=\"button\" data-v=\"psyche\">PSYCHE<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"sidenote\"><b>Psyche<\u002Fb> is the original judge. <b>Aphrodite<\u002Fb> is the\n        refinement: it is told each line's payout tier — PrizePicks' own price on the prop —\n        anchors on how many of the last five actually cleared, and is told that the board\n        bets its highest numbers, so overstating costs more than understating. Run both on\n        the same slate and compare them on\n        <a href=\"/api/calibration\" target=\"_blank\" rel=\"noopener\">calibration<\u002Fa>: the column\n        to watch is <i>overstated<\u002Fi>, not the win rate.<\u002Fdiv>\n\n      <div class=\"sides\" id=\"models\" style=\"margin-top:10px\">\n        <button class=\"sidebtn active\" type=\"button\" data-v=\"claude-haiku-4-5-20251001\">VILIFIANT<\u002Fbutton>\n        <button class=\"sidebtn\" type=\"button\" data-v=\"claude-sonnet-5\">SONNET<\u002Fbutton>\n        <button class=\"sidebtn\" type=\"button\" data-v=\"claude-opus-4-8\">OPUS<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"sidenote\">Which model writes the probabilities. <b>Vilifiant<\u002Fb> is the default —\n        about 5x cheaper a run than Opus, which is the difference between roughly 37 runs a month and\n        several hundred. Opus had not been earning its price: it scores 0.240 on Brier against the\n        0.250 you get guessing 50% on everything, and the biggest fault in 1,855 graded picks was\n        never reasoning — it was that the judge was not told the payout tier. The real risk in going\n        cheaper is instruction-following, so check the <i>tier gap<\u002Fi> on\n        <a href=\"/api/calibration\" target=\"_blank\" rel=\"noopener\">calibration<\u002Fa> after the first run:\n        it reads within the hour, before any game settles, and a collapsed gap means the prompt did\n        not land.<\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding-top:0\">\n      <div class=\"label\"><b>Risk Tier<\u002Fb><span class=\"hr\"><\u002Fspan><\u002Fdiv>\n      <div class=\"tiers\" id=\"tiers\">\n        <div class=\"tier g active\" data-v=\"goblin\"><span class=\"tglyph\"><img src=\"861ada3c-b8d2-4f35-a88a-15d467a42e0e\" alt=\"\"><\u002Fspan>Goblin<\u002Fdiv>\n        <div class=\"tier s active\" data-v=\"standard\"><span class=\"tglyph\"><img src=\"961bc2d4-7aa3-4601-833d-a3de1c4226e1\" alt=\"\"><\u002Fspan>Standard<\u002Fdiv>\n        <div class=\"tier d\" data-v=\"demon\"><span class=\"tglyph\"><img src=\"4d8f48f4-6eb6-43aa-80ad-36ba075dd7ee\" alt=\"\"><\u002Fspan>Demon<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <button class=\"run\" id=\"runBtn\">FIND BETS →<\u002Fbutton>\n    <button class=\"run ghost\" id=\"calBtn\" style=\"margin-top:-12px\">BALANCED TEST RUN<\u002Fbutton>\n    <div class=\"sidenote\" style=\"margin:-8px 28px 20px\">Runs all three tiers with EQUAL numbers of each,\n      to measure the judge rather than to bet. A normal run ranks candidates by tier, so a board can end up\n      with no demons at all — the log is 1162 goblins against 343 demons — and the\n      <a href=\"/api/calibration\" target=\"_blank\" rel=\"noopener\">tier gap<\u002Fa>, which is how you tell whether the\n      judge read the payout tier, cannot be computed without both ends. Costs the same as any other run: the web\n      searches dominate and all 44 props together are about a penny.\n      <b>Do not bet the result as one slip.<\u002Fb> Two demons at a measured 19.5% each drag a mixed six-leg to\n      roughly -85% expected value, the worst shape on the board.<\u002Fdiv>\n\n    <section id=\"searchStatus\" style=\"padding-top:0\"><\u002Fsection>\n    <section id=\"searchResults\" style=\"padding-top:0\"><\u002Fsection>\n\n    <!-- Slip builder. Hidden until you add a leg; the payout math is computed by\n         /api/bet-finder-size against real PrizePicks tables, never guessed here. -->\n    <section id=\"slipTray\" style=\"padding-top:0\" hidden>\n      <div class=\"label\"><b>Your Slip<\u002Fb><span class=\"hr\"><\u002Fspan><span id=\"trayCount\" class=\"traycount\"><\u002Fspan><\u002Fdiv>\n      <div id=\"trayLegs\"><\u002Fdiv>\n      <div class=\"trayrow\">\n        <label class=\"k\" for=\"trayStake\">Entry<\u002Flabel>\n        <div class=\"entrytoggle\">\n          <button class=\"etoggle active\" type=\"button\" data-entry=\"power\">POWER<\u002Fbutton>\n          <button class=\"etoggle\" type=\"button\" data-entry=\"flex\">FLEX<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"trayrow\">\n        <label class=\"k\" for=\"trayStake\">Stake<\u002Flabel>\n        <div class=\"stakebox\"><span>$<\u002Fspan><input id=\"trayStake\" type=\"number\" min=\"0\" step=\"1\" value=\"10\" inputmode=\"decimal\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div id=\"trayMath\"><\u002Fdiv>\n      <div class=\"trayrow\" style=\"margin-top:14px\">\n        <input id=\"trayName\" type=\"text\" maxlength=\"60\" placeholder=\"Name this slip (optional)\">\n      <\u002Fdiv>\n      <button class=\"run\" id=\"traySave\" style=\"margin-top:12px\">SAVE TO ATOMBETS →<\u002Fbutton>\n      <div id=\"trayMsg\" class=\"traymsg\"><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <!-- ============ TODAY'S PICKS ============ -->\n  <div id=\"tabToday\" class=\"tabpanel\" role=\"tabpanel\" hidden=\"\">\n    <section>\n      <div id=\"scoreBar\" hidden><\u002Fdiv>\n      <div class=\"label\"><b>Today's Ledger<\u002Fb><span class=\"hr\"><\u002Fspan><button id=\"ledgerRefresh\" style=\"background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:10px;cursor:pointer\">↻ refresh<\u002Fbutton><\u002Fdiv>\n      <div id=\"ledgerRec\"><\u002Fdiv>\n      <div id=\"ledgerBody\"><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <!-- ============ MY SLIPS ============ -->\n  <div id=\"tabSlips\" class=\"tabpanel\" role=\"tabpanel\" hidden=\"\">\n    <section>\n      <div class=\"label\"><b>Saved Slips<\u002Fb><span class=\"hr\"><\u002Fspan><button id=\"slipsRefresh\" style=\"background:none;border:none;color:var(--dim);font-family:var(--mono);font-size:10px;cursor:pointer\">↻ refresh<\u002Fbutton><\u002Fdiv>\n      <div id=\"slipsSummary\" class=\"slipsum\" hidden><\u002Fdiv>\n      <div id=\"slipsBody\"><\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n\n  <div class=\"devlinks\">\n    <a href=\"/api/calibration\">◇ Calibration<\u002Fa>\n    <a href=\"/api/top-picks\">◇ Ledger<\u002Fa>\n    <a href=\"/api/dev\">◇ Dev Console<\u002Fa>\n  <\u002Fdiv>\n  <!-- Phones have no dev console, so the last run's timing is also readable and\n       copyable here. Hidden until a run has actually produced one. -->\n  <div class=\"devlinks\" id=\"runReportRow\" hidden>\n    <a href=\"#\" id=\"runReportBtn\">◇ Last Run Timing<\u002Fa>\n  <\u002Fdiv>\n  <pre id=\"runReportBox\" class=\"reportbox\" hidden><\u002Fpre>\n  <!-- Build stamp: the whole app is one cached HTML file, so \"the new thing isn't there\" is usually a stale copy. This makes that checkable at a glance. -->\n  <div class=\"foot\">ATOMBETS TERMINAL <b id=\"appVer\">v4.20.0<\u002Fb> · api <b id=\"apiVer\">…<\u002Fb> — not advice, track your own slips<\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n/* Deploy check. The footer shows the version baked into this PAGE next to the\n   version the FUNCTIONS report. Matching means the whole deploy landed; a\n   mismatch says which half is stale; \"offline\" means the functions are not\n   answering at all. */\n(function(){\n  var el = document.getElementById(\"apiVer\");\n  if(!el) return;\n  fetch(\"/api/version\", { cache: \"no-store\" })\n    .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })\n    .then(function(d){\n      var app = (document.getElementById(\"appVer\")||{}).textContent || \"\";\n      var api = \"v\" + d.version;\n      el.textContent = api + (d.commit ? \" · \" + d.commit : \"\");\n      el.style.color = (api === app) ? \"\" : \"#ff6b6b\";\n      if(api !== app) el.title = \"Page and functions are on different versions — the deploy only half landed\";\n    })\n    .catch(function(){ el.textContent = \"offline\"; el.style.color = \"#ff6b6b\"; });\n})();\n<\u002Fscript>\n\n<script>\n/* ============================================================\n   DATA LAYER — real endpoints. Contract: docs/UI-CONTRACT.md\n   Two calls are background jobs, not plain fetches: Netlify kills a\n   synchronous function at ~10s, grading takes 30-40s and a board run\n   takes minutes. Both go POST -> 202 -> poll.\n   ============================================================ */\n\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\n\n// Never call .json() blind. A timed-out or crashed function answers with an HTML\n// error page, and .json() on that throws a browser-specific message that names\n// nothing useful (Safari: \"The string did not match the expected pattern\").\nasync function readJSON(r, label){\n  const body = await r.text();\n  let data = null;\n  try { data = JSON.parse(body); } catch {}\n  if(!data){\n    const snip = body.replace(/<[^>]*>/g,' ').replace(/\\s+/g,' ').trim().slice(0,120);\n    throw new Error(label + ' returned ' + r.status + (snip ? ': ' + snip : ' (not JSON)'));\n  }\n  return data;\n}\nasync function getJSON(url, label){ return readJSON(await fetch(url), label); }\n\n// prob is a decimal 0-1 on the wire; this UI renders percentages.\nconst toPct = p => (p == null || isNaN(p)) ? null : Math.round(Number(p) * 100);\n/* ---- run report --------------------------------------------------------------\n   Every heavy run prints its own timing breakdown to the dev console — the same\n   numbers needed to troubleshoot a slow run, so \"it felt slow\" never has to be\n   the whole bug report. The last report also lives at window.__atombets.last:\n   open the console, right-click the object → Copy object, and paste it.\n   Pieces run concurrently, so wall time is NOT their sum. */\nfunction runReport(kind, out){\n  try{\n    const tm = (out && out.timing) || null;\n    if(!tm) return;                       // older function build — nothing to report\n    const secs = ms => ms==null ? '—' : (ms/1000).toFixed(1)+'s';\n    const lines = Object.entries(tm.pieces||{}).sort((a,b)=>b[1]-a[1])\n      .map(([k,v])=>'    '+(k+'           ').slice(0,11)+secs(v));\n    const detail = {\n      at: new Date().toISOString(), kind,\n      timing: tm,\n      params: out.params || null,\n      oddsStatus: out.oddsStatus || null,\n      mlbStatus: out.mlbStatus || null,\n      dataStatus: out.dataStatus || null,\n    };\n    window.__atombets = window.__atombets || { runs: [] };\n    window.__atombets.runs.push(detail);\n    window.__atombets.last = detail;\n    const head = kind+' — '+secs(tm.totalMs)+' wall'+\n      (tm.rows!=null ? ' · '+tm.rows+' props' : '')+\n      (tm.candidates!=null ? ' · '+tm.candidates+' candidates' : '');\n    console.log('[AtomBets] '+head+'\\n'+lines.join('\\n')+\n      '\\n    (pieces overlap — wall time ≠ sum)'+\n      '\\n  full detail: window.__atombets.last', detail);\n    // Same thing on screen, because a phone has no console. Tap-to-select all.\n    const box = document.getElementById('runReportBox');\n    const row = document.getElementById('runReportRow');\n    if(box && row){\n      box.textContent = head+'\\n'+lines.join('\\n')+\n        '\\n    (pieces overlap — wall time ≠ sum)\\n\\n'+JSON.stringify(detail, null, 2);\n      row.hidden = false;\n    }\n  }catch(e){ /* reporting must never break a run */ }\n}\n// Raw numbers behind a pick — straight from PrizePicks (per-game history) and\n// ESPN (starter season lines, park). Deliberately NOT the judge's output: this\n// panel exists so you can check any verdict against the same facts the judge\n// saw, and it renders whatever subset arrived. Returns '' when nothing did.\nfunction statsHtml(p, ctx){\n  const rows = [];\n  const line = Number(p.line);\n  const games = (Array.isArray(p.histGames) && p.histGames.length ? p.histGames\n              : Array.isArray(p.recent5) ? p.recent5.map(v=>({v})) : []).slice(0,5);\n  if(games.length){\n    const cells = games.map(g=>{\n      const v = Number(g.v);\n      const cls = (isFinite(line) && isFinite(v)) ? (v > line ? ' over' : ' under') : '';\n      return '<div class=\"g5cell'+cls+'\"><b>'+esc(g.v)+'<\u002Fb>'+(g.opp?'<span>'+esc((g.away?'@':'vs ')+g.opp)+'<\u002Fspan>':'')+'<\u002Fdiv>';\n    }).join('');\n    const beat = isFinite(line) ? games.filter(g=>isFinite(Number(g.v)) && Number(g.v) > line).length : null;\n    rows.push('<div class=\"statrow\"><div class=\"statlbl\">LAST '+games.length+' GAMES <span class=\"statsrc\">· PRIZEPICKS<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"g5\">'+cells+'<\u002Fdiv>'+\n      '<div class=\"statline\">'+(beat!=null ? '<b>'+beat+'/'+games.length+'<\u002Fb> over '+esc(p.line) : '')+\n      (p.recentAvg!=null ? ' · avg <b>'+esc(p.recentAvg)+'<\u002Fb>' : '')+'<\u002Fdiv><\u002Fdiv>');\n  }\n  const sp = p.selfSP || p.oppSP;\n  if(sp && sp.name){\n    const bits = [];\n    if(sp.era!=null)  bits.push('ERA <b>'+esc(sp.era)+'<\u002Fb>');\n    if(sp.whip!=null) bits.push('WHIP <b>'+esc(sp.whip)+'<\u002Fb>');\n    if(sp.k!=null)    bits.push('K <b>'+esc(sp.k)+'<\u002Fb>');\n    rows.push('<div class=\"statrow\"><div class=\"statlbl\">'+(p.selfSP?'SEASON LINE':'OPPOSING STARTER')+' <span class=\"statsrc\">· ESPN<\u002Fspan><\u002Fdiv>'+\n      '<div class=\"statline\">'+esc(sp.name)+(sp.throws?' ('+esc(sp.throws)+')':'')+(bits.length?' — '+bits.join(' · '):'')+'<\u002Fdiv><\u002Fdiv>');\n  }\n  const facts = [];\n  if(ctx && ctx.record) facts.push('RECORD <b>'+esc(ctx.record)+'<\u002Fb>');\n  if(ctx && ctx.winPct!=null) facts.push('WIN% <b>'+Math.round(Number(ctx.winPct)*100)+'%<\u002Fb>');\n  if(p.parkIndex!=null) facts.push('PARK <b>'+esc(p.parkIndex)+'<\u002Fb> <span class=\"statsrc\">100 = neutral<\u002Fspan>');\n  if(facts.length) rows.push('<div class=\"statrow\"><div class=\"statlbl\">TEAM / VENUE <span class=\"statsrc\">· ESPN<\u002Fspan><\u002Fdiv><div class=\"statline\">'+facts.join(' · ')+'<\u002Fdiv><\u002Fdiv>');\n  return rows.join('');\n}\n// Injuries for ONE card, on demand. The slate-wide version was ~90 names a team\n// straight off the full organisational roster — a book you had to scroll past to\n// reach the picks. This answers the two questions that actually bear on a leg:\n// is HE out, and is anyone on HIS team out. Nobody else's team appears.\nconst INJ_SHOWN = 8;\nfunction injPanelHtml(p, byTeam){\n  if(!byTeam) return '';                       // no MLB data this run — no button\n  const team = String(p.team||'').toUpperCase();\n  const list = byTeam[team] || [];\n  const mine = normName(p.player);\n  const teammates = list.filter(x=>normName(x.name) !== mine);\n  const rows = [];\n\n  rows.push('<div class=\"statrow\"><div class=\"statlbl\">'+esc(p.player)+' <span class=\"statsrc\">· MLB<\u002Fspan><\u002Fdiv>'+\n    '<div class=\"statline\">'+(p.injured\n      ? '<span style=\"color:var(--red)\">'+esc(p.injured)+'<\u002Fspan> — not expected to play.'\n      : 'No injury designation. <span style=\"color:var(--faint)\">Active on the 40-man.<\u002Fspan>')+'<\u002Fdiv><\u002Fdiv>');\n\n  if(teammates.length){\n    // Already ordered most-relevant-first by the server (day-to-day before 60-day).\n    const shown = teammates.slice(0, INJ_SHOWN).map(x=>\n      '<div class=\"statline\"><span style=\"color:var(--red)\">'+esc(x.name)+'<\u002Fspan>'+\n      (x.position?' <span style=\"color:var(--faint)\">'+esc(x.position)+'<\u002Fspan>':'')+\n      ' — '+esc(x.status)+'<\u002Fdiv>').join('');\n    const more = teammates.length > INJ_SHOWN\n      ? '<div class=\"statline\" style=\"color:var(--faint)\">+ '+(teammates.length-INJ_SHOWN)+' more, longer-term.<\u002Fdiv>' : '';\n    rows.push('<div class=\"statrow\"><div class=\"statlbl\">'+esc(team)+' — '+teammates.length+\n      ' OUT <span class=\"statsrc\">· MLB 40-MAN<\u002Fspan><\u002Fdiv>'+shown+more+'<\u002Fdiv>');\n  } else {\n    rows.push('<div class=\"statrow\"><div class=\"statline\" style=\"color:var(--faint)\">No one else on '+esc(team)+\n      '\\u2019s 40-man is listed out.<\u002Fdiv><\u002Fdiv>');\n  }\n  return rows.join('');\n}\nconst normName = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/[^a-z0-9]/g,'');\n\n// Game start, for the board card only — so you can see how long you have to place\n// the bet. PrizePicks stamps start_time with the GAME's local offset\n// (\"2026-08-13T19:30:00.000-04:00\"), so the Date is the correct instant and this\n// renders it in YOUR timezone. Never fed to the judge and never logged for\n// calibration; if the clock is wrong the worst case is a wrong label, not a\n// wrong probability. Returns '' on anything unparseable so the card just omits it.\nfunction gameTime(iso){\n  if(!iso) return '';\n  const d = new Date(iso);\n  if(isNaN(d.getTime())) return '';\n  let t;\n  try { t = d.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' }); }\n  catch { return ''; }\n  // A late game can be tomorrow in your zone even though PrizePicks calls it today.\n  if(d.toDateString() !== new Date().toDateString()){\n    try { t = d.toLocaleDateString([], { weekday:'short' }) + ' ' + t; } catch {}\n  }\n  return t;\n}\n// The API's own verdict is authoritative (its buckets are enforced in the judge\n// prompt); only derive one when a row doesn't carry it.\nconst verdictOf = o => {\n  // Board mode grades play|lean|pass while slip mode uses play|lean|coinflip|fade.\n  // 'pass' has no styling of its own and means the same thing as 'fade' — don't play it.\n  const v = o && o.verdict ? String(o.verdict).toLowerCase() : null;\n  if(v === 'pass') return 'fade';\n  if(v) return v;\n  return verdictFromProb(toPct(o && o.prob) ?? 50);\n};\n// The judge runs with web search on, so its prose carries citation markup.\nfunction prose(str){ return esc(String(str ?? '').replace(/<\\/?cite\\b[^>]*>/gi, '')); }\n\n// POST -> 202 -> poll status until done/error.\nasync function runJob(name, payload, onStep, budgetMs){\n  const jobId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()\n    : name + '-' + Date.now() + '-' + Math.random().toString(16).slice(2);\n  const post = await fetch('/api/' + name + '-background', {\n    method: 'POST', headers: { 'Content-Type': 'application/json' },\n    body: JSON.stringify(Object.assign({ jobId }, payload))\n  });\n  if(post.status >= 400){\n    let msg = name + ' returned ' + post.status;\n    try { const d = await readJSON(post, name); msg = d.message || d.error || msg; }\n    catch(e){ msg = e.message; }\n    throw new Error(msg);\n  }\n  const started = Date.now();\n  let misses = 0;\n  while(Date.now() - started < (budgetMs || 10 * 60 * 1000)){\n    await sleep(2000);\n    let st;\n    // One bad poll is a blip; several in a row means the endpoint is down and\n    // waiting out the whole budget to say so just wastes the user's time.\n    try {\n      st = await readJSON(await fetch('/api/' + name + '-status?jobId=' + encodeURIComponent(jobId)), name + '-status');\n      misses = 0;\n    } catch(e){\n      if(++misses >= 5) throw new Error('lost contact with the job — ' + e.message);\n      continue;\n    }\n    if(st.status === 'done') return st.result;\n    if(st.status === 'error') throw new Error(st.message || (name + ' failed'));\n    if(onStep) onStep(st.step || 'working', Date.now() - started, st.typicalMs || null);\n  }\n  throw new Error('timed out waiting for ' + name);\n}\n\n/* ============================================================ */\n\nfunction esc(s){ return String(s??'').replace(/[&<>\"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); }\nfunction initials(name){ return (name||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }\nfunction verdictFromProb(p){ return p>=65?'play':p>=58?'lean':p>=52?'coinflip':'fade'; }\nfunction tierIcon(tier){\n  if(tier==='goblin') return '<img class=\"tiericon\" src=\"'+window.__resources.goblinImg+'\" alt=\"goblin\">';\n  if(tier==='demon') return '<img class=\"tiericon\" src=\"'+window.__resources.demonImg+'\" alt=\"demon\">';\n  if(tier==='standard') return '<img class=\"tiericon\" src=\"'+window.__resources.standardImg+'\" alt=\"standard\">';\n  return '';\n}\nfunction avatarHtml(name, img){\n  // Initials are the base layer; a real headshot covers them when the row has\n  // one. The old placeholder host doesn't exist, so requesting it per row was a\n  // guaranteed failed request.\n  return '<div class=\"avatar\">' + esc(initials(name)) +\n    (img ? '<img src=\"' + esc(img) + '\" alt=\"\" onerror=\"this.style.display=\\'none\\'\">' : '') + '<\u002Fdiv>';\n}\n// MLB cap logo, with the ESPN PNG as a fallback and nothing at all as the last\n// resort — a logo-shaped hole is worse than no logo. Both are deterministic from\n// ids we already have, so this costs no extra request planning.\nfunction teamMarkHtml(src, fallback){\n  if(!src && !fallback) return '';\n  // The box collapses to nothing when there's no mark, so a card without a\n  // resolved team keeps the exact same layout as one with it.\n  const onerr = fallback\n    ? \"this.onerror=null;this.src='\" + String(fallback).replace(/'/g, '') + \"'\"\n    : \"this.closest('.tmark').style.display='none'\";\n  return '<div class=\"tmark\"><img class=\"tlogo\" src=\"' + esc(src || fallback) +\n    '\" alt=\"\" loading=\"lazy\" onerror=\"' + onerr + '\"><\u002Fdiv>';\n}\n\n/* ---- tabs ---- */\n(function(){\n  const tabs=[['tabBtnRate','tabRate'],['tabBtnSearch','tabSearch'],['tabBtnToday','tabToday'],['tabBtnSlips','tabSlips']];\n  function sel(which){\n    tabs.forEach(([btnId,panelId])=>{\n      document.getElementById(btnId).setAttribute('aria-selected', String(panelId===which));\n      document.getElementById(panelId).hidden = panelId!==which;\n    });\n    if(which==='tabToday') loadLedger();\n    if(which==='tabSlips') loadSlips();\n  }\n  tabs.forEach(([btnId,panelId])=>document.getElementById(btnId).addEventListener('click',()=>sel(panelId)));\n})();\n\n/* ---- Board Setup: legs stepper ---- */\n(function(){\n  let legs=3; const lv=document.getElementById('legVal');\n  document.getElementById('legUp').onclick=()=>{ legs=Math.min(6,legs+1); lv.textContent=String(legs).padStart(2,'0'); };\n  document.getElementById('legDown').onclick=()=>{ legs=Math.max(2,legs-1); lv.textContent=String(legs).padStart(2,'0'); };\n})();\n\n/* ---- League chips — live from GET /api/pp-leagues, markup chips are the fallback ---- */\nlet currentLeague = null;\n// Fallback only — the live list replaces this as soon as /api/pp-leagues answers.\nlet LEAGUES = [\n  { id:'2', name:'MLB',  tag:'mlb',  projections:null, kind:'game', research:'full' },\n  { id:'3', name:'WNBA', tag:'wnba', projections:null, kind:'game', research:'full' },\n  { id:'9', name:'NFL',  tag:'nfl',  projections:null, kind:'game', research:'full' },\n];\nasync function loadLeagues(){\n  try {\n    const d = await getJSON('/api/pp-leagues', 'pp-leagues');\n    if(Array.isArray(d.leagues) && d.leagues.length) LEAGUES = d.leagues;\n  } catch(e){ /* keep the fallback chips */ }\n  currentLeague = LEAGUES.find(l => currentLeague && l.tag === currentLeague.tag) || LEAGUES[0];\n  renderLeagues(); renderLeagueDisclaimer(); loadProps(currentLeague.tag);\n}\nfunction renderLeagues(){\n  const wrap=document.getElementById('leagueScroll');\n  const leagues=LEAGUES;\n  currentLeague = currentLeague || leagues[0];\n  wrap.innerHTML = leagues.map(l=>\n    '<button class=\"leaguechip'+(l.tag===currentLeague.tag?' active':'')+'\" data-tag=\"'+esc(l.tag)+'\">'+esc(l.name)+\n      (l.projections?'<span class=\"lgn\">'+esc(l.projections)+'<\u002Fspan>':'')+'<\u002Fbutton>'\n  ).join('');\n  wrap.querySelectorAll('.leaguechip').forEach(b=>b.addEventListener('click',()=>{\n    currentLeague = leagues.find(l=>l.tag===b.dataset.tag);\n    renderLeagues(); renderLeagueDisclaimer(); loadProps(currentLeague.tag);\n  }));\n  dragScroll(wrap);\n}\nconst FLAG_INFO = {\n  'SEASON':'Season-long futures — not tonight\\'s game. Confident per-game grading doesn\\'t apply here.',\n  'LIVE':'In-progress game — lines and matchups are moving in real time.',\n  'PERIOD':'A half/quarter split, not the full game.',\n  'SERIES':'Spans multiple games, not a single matchup.',\n  'PROPS ONLY':'Props load but ship with no standings/odds research attached — probabilities are widened toward 50%.',\n};\nfunction renderLeagueDisclaimer(){\n  const info=document.getElementById('leagueInfo');\n  const flags=[];\n  if(currentLeague.kind!=='game') flags.push(currentLeague.kind.toUpperCase());\n  if(currentLeague.research!=='full') flags.push('PROPS ONLY');\n  if(!flags.length){ info.hidden=true; return; }\n  info.hidden=false;\n  info.innerHTML = flags.map(f=>'<div><b>'+esc(f)+'<\u002Fb> — '+esc(FLAG_INFO[f]||'')+'<\u002Fdiv>').join('');\n}\nconst PROPS = {};   // league tag -> [{ stat, display, count }]\nasync function loadProps(tag){\n  renderProps();                       // paint immediately from cache (or empty)\n  if(PROPS[tag]) return;\n  try {\n    const d = await getJSON('/api/pp-stats?league=' + encodeURIComponent(tag), 'pp-stats');\n    if(Array.isArray(d.statTypes)) PROPS[tag] = d.statTypes;\n  } catch(e){ /* \"All props\" still works without the list */ }\n  if(currentLeague && currentLeague.tag === tag) renderProps();\n}\nfunction renderProps(){\n  const wrap=document.getElementById('propScroll');\n  const stats=PROPS[currentLeague.tag] || [];\n  wrap.innerHTML = '<button class=\"propchip active\" data-v=\"\">All props<\u002Fbutton>' +\n    stats.map(s=>'<button class=\"propchip\" data-v=\"'+esc(s.stat)+'\">'+esc(s.display||s.stat)+\n      (s.count?'<span class=\"lgn\">'+esc(s.count)+'<\u002Fspan>':'')+'<\u002Fbutton>').join('');\n  wrap.querySelectorAll('.propchip').forEach(c=>c.addEventListener('click',()=>{\n    wrap.querySelectorAll('.propchip').forEach(x=>x.classList.remove('active')); c.classList.add('active');\n  }));\n  dragScroll(wrap);\n}\nfunction dragScroll(el){\n  // Capturing the pointer on pointerdown retargets the subsequent click to this\n  // container, which swallows taps on the chips inside it — the chips are the\n  // primary navigation, so that has to keep working. Capture only once the\n  // movement is genuinely a drag, and swallow the click only in that case.\n  const THRESHOLD = 6;\n  let down=false, dragging=false, sx=0, ss=0, pid=null;\n  el.addEventListener('pointerdown', e=>{ down=true; dragging=false; pid=e.pointerId; sx=e.clientX; ss=el.scrollLeft; });\n  el.addEventListener('pointermove', e=>{\n    if(!down) return;\n    const dx = e.clientX - sx;\n    if(!dragging && Math.abs(dx) > THRESHOLD){\n      dragging = true;\n      try { el.setPointerCapture(pid); } catch(err){}\n    }\n    if(dragging) el.scrollLeft = ss - dx;\n  });\n  function end(){\n    if(dragging){\n      try { el.releasePointerCapture(pid); } catch(err){}\n      el.addEventListener('click', ev=>{ ev.stopPropagation(); ev.preventDefault(); }, { capture:true, once:true });\n    }\n    down=false; dragging=false;\n  }\n  el.addEventListener('pointerup', end);\n  el.addEventListener('pointercancel', end);\n}\nrenderLeagues(); renderProps(); renderLeagueDisclaimer(); loadLeagues();\n\ndocument.getElementById('tiers').querySelectorAll('.tier').forEach(t=>t.addEventListener('click',()=>t.classList.toggle('active')));\n// Side is exclusive — a prop is one bet or the other, never both at once.\ndocument.getElementById('sides').addEventListener('click', e=>{\n  const b = e.target.closest('.sidebtn');\n  if(!b) return;\n  document.querySelectorAll('#sides .sidebtn').forEach(x=>x.classList.toggle('active', x===b));\n});\n// Which judge writes the probabilities. Exclusive, same as Side.\ndocument.getElementById('judges').addEventListener('click', e=>{\n  const b = e.target.closest('.sidebtn');\n  if(!b) return;\n  document.querySelectorAll('#judges .sidebtn').forEach(x=>x.classList.toggle('active', x===b));\n});\n// Which model runs it. Exclusive, same as Judge.\ndocument.getElementById('models').addEventListener('click', e=>{\n  const b = e.target.closest('.sidebtn');\n  if(!b) return;\n  document.querySelectorAll('#models .sidebtn').forEach(x=>x.classList.toggle('active', x===b));\n});\n\n/* ---- Find Bets: background + poll pattern ---- */\n// The balanced run shares this handler; it only changes what gets requested.\n// `this` is the button that was clicked, so the disable/re-enable is correct\n// either way.\ndocument.getElementById('calBtn').addEventListener('click', function(){\n  RUN_BALANCED = true;\n  document.getElementById('runBtn').click();\n});\nlet RUN_BALANCED = false;\ndocument.getElementById('runBtn').addEventListener('click', async function(){\n  const btn=this, statusEl=document.getElementById('searchStatus'), resultsEl=document.getElementById('searchResults');\n  btn.disabled=true; resultsEl.innerHTML='';\n  let typicalMs=280000; // until the job reports its own average\n  statusEl.innerHTML='<div class=\"step\"><div class=\"spin\"><\u002Fdiv><div class=\"step-text\" id=\"bfStep\">Scanning today\\u2019s board…<\u002Fdiv><\u002Fdiv><div class=\"pbar\"><i id=\"bfPbar\" style=\"width:0%\"><\u002Fi><\u002Fdiv>';\n  try{\n    // No \"today only\" control in this layout; tonight's slate is the useful default.\n    const tiers=[].slice.call(document.querySelectorAll('#tiers .tier.active')).map(t=>t.dataset.v).filter(Boolean);\n    const legs=parseInt(document.getElementById('legVal').textContent,10)||3;\n    const chip=document.querySelector('#propScroll .propchip.active');\n    const balance = RUN_BALANCED; RUN_BALANCED = false;   // one run only, never sticky\n    // A balanced run needs all three tiers regardless of what the chips say —\n    // the whole point is a sample with both ends of the price range in it.\n    const payload={ league: currentLeague.tag, legs, today: true,\n      tiers: balance ? ['goblin','standard','demon'] : tiers };\n    if(balance) payload.balance = true;\n    if(chip && chip.dataset.v) payload.statFilter = chip.dataset.v;\n    const sideBtn=document.querySelector('#sides .sidebtn.active');\n    payload.sides = sideBtn ? sideBtn.dataset.v : 'both';\n    const judgeBtn=document.querySelector('#judges .sidebtn.active');\n    if(judgeBtn) payload.prompt = judgeBtn.dataset.v;\n    const modelBtn=document.querySelector('#models .sidebtn.active');\n    if(modelBtn) payload.model = modelBtn.dataset.v;\n\n    const out = await runJob('bet-finder', payload, (text, elapsed, typical)=>{\n      if(typical) typicalMs = typical;\n      const st=document.getElementById('bfStep'), pb=document.getElementById('bfPbar');\n      if(st) st.textContent=text;\n      if(pb) pb.style.width=Math.min(96,(elapsed/typicalMs)*100+10)+'%';\n    });\n    statusEl.innerHTML='';\n    runReport('find bets', out);\n    LAST_RUN = { picks: (out && (out.board || out.allPicks)) || [], out: out || {} };\n    renderBoardResults();\n  }catch(e){\n    statusEl.innerHTML='<div class=\"errbox\">⚠ '+esc(e.message||'scan failed — try again')+'<\u002Fdiv>';\n  }finally{ btn.disabled=false; }\n});\n\n/* ---- board render + sort ----\n   The run result is kept so sorting is a pure re-render — no refetch, no lost\n   panels' worth of data. Sort survives across runs within the session. */\nlet LAST_RUN = null;\nlet boardSort = 'edge';   // 'edge' (prob minus break-even), 'team', 'time'\n/* Break-even per leg for a pure 3-pick Power of each tier, from the real payout\n   tables: goblin 2.0x, standard 4.75x, demon 12.0x. Mirrors the server so a\n   board rendered from an older run still sorts correctly. */\nconst BREAK_EVEN = { goblin: 0.7937, standard: 0.5946, demon: 0.4368 };\n/* Returns null when this SIDE's payout isn't known.\n   odds_type describes the OVER side, so an under on a goblin or demon line is\n   priced by something the tables don't carry — measured on a real card at ~7.5x\n   for a 3-pick, against goblin 2.0 / standard 4.75 / demon 12.0. Borrowing the\n   line's own tier there doesn't approximate it, it prices the opposite side of\n   the bet. */\nfunction sidePriced(p){\n  if(p.sidePriceUnverified === true) return false;\n  if(p.sidePriceUnverified === false) return true;\n  const side = p.side||p.pick||'over';                    // older payloads\n  return side !== 'under' || (p.oddsType||'standard').toLowerCase() === 'standard';\n}\nfunction edgeOf(p){\n  if(!sidePriced(p)) return null;\n  if(typeof p.edge === 'number') return p.edge;   // server-computed\n  const q = Number(p.sideProb!=null?p.sideProb:p.prob)||0;\n  const be = BREAK_EVEN[(p.oddsType||'standard').toLowerCase()] ?? BREAK_EVEN.standard;\n  return q - be;\n}\n/* Sort key: an unpriced leg can't be ranked against a priced one, so it sorts\n   below every priced leg and by its own probability among its peers. */\nfunction edgeRank(p){\n  const e = edgeOf(p);\n  return e==null ? -Infinity : e;\n}\nconst probOf = p => Number(p.sideProb!=null?p.sideProb:p.prob)||0;\nfunction sortedPicks(){\n  const arr = LAST_RUN.picks.slice();\n  const prob = p => Number(p.sideProb!=null?p.sideProb:p.prob)||0;\n  if(boardSort==='team'){\n    arr.sort((a,b)=> String(a.team||'￿').localeCompare(String(b.team||'￿')) || edgeRank(b)-edgeRank(a) || probOf(b)-probOf(a));\n  } else if(boardSort==='time'){\n    // Missing/unparseable start times sink to the bottom rather than faking \"first\".\n    const ts = p => { const t = Date.parse(p.start||''); return isNaN(t) ? Infinity : t; };\n    arr.sort((a,b)=> ts(a)-ts(b) || edgeRank(b)-edgeRank(a) || probOf(b)-probOf(a));\n  } else {\n    /* EDGE, not probability. This sort used to be raw probability while calling\n       itself \"EDGE %\", which ranked the board almost exactly backwards: a\n       goblin line is set LOW so the over is easy, but it pays 2.0x on a 3-pick\n       Power and needs 79.4% a leg to break even. An 80% goblin is therefore\n       worth about +0.6pp, while a 65% standard is +5.5pp — nine times better —\n       and the old sort put the goblin on top every single time. */\n    arr.sort((a,b)=> edgeOf(b)-edgeOf(a) || prob(b)-prob(a));\n  }\n  return arr;\n}\n/* ---- the engine's own slip ----\n   Not \"the N highest percentages\". selectLegs caps legs per player (props on one\n   man move together), spreads across games where the slate allows, drops anyone\n   MLB lists as inactive, and breaks ties toward the leg with real recent form\n   behind it. If fewer legs clear the bar than you asked for it says so and hands\n   you the shorter slip — padding a 5-leg request with two coinflips makes the\n   slip worse, not longer. */\nfunction recSlipHtml(out){\n  const legs = out.parlayLegs || [];\n  const note = out.parlayNote || {};\n  if(!legs.length){\n    if(!note.requested) return '';\n    return '<div class=\"recbox\"><div class=\"statlbl\">RECOMMENDED SLIP<\u002Fdiv>'+\n      '<div class=\"recwhy recwarn\">Nothing on this slate cleared the bar for a '+esc(note.requested)+\n      '-leg slip. That is the honest answer — the board below is still worth reading, but the engine will not build you a card out of coinflips.<\u002Fdiv><\u002Fdiv>';\n  }\n  const rows = legs.map(l=>{\n    const pc = toPct(l.prob);\n    return '<div class=\"recline\">'+\n      '<div class=\"rl-name\">'+tierIcon(l.oddsType)+esc(l.player)+'<\u002Fdiv>'+\n      '<div class=\"rl-stat\">'+esc(l.statDisplay||l.stat)+' <span class=\"side '+esc(l.pick||'over')+'\">'+\n        esc(l.pick||'over')+'<\u002Fspan> '+esc(l.line)+'<\u002Fdiv>'+\n      '<div class=\"rl-p\">'+(pc==null?'—':pc+'%')+'<\u002Fdiv>'+\n    '<\u002Fdiv>';\n  }).join('');\n\n  const parlay = out.parlay || {};\n  const dist = parlay.hitDistribution || [];\n  const allHit = dist[legs.length]!=null ? Math.round(dist[legs.length]*100) : null;\n  const entry = parlay.entries ? (parlay.entries.power || parlay.entries.flex) : null;\n  const ev = entry && entry.evPerDollar!=null ? entry.evPerDollar : null;\n\n  const bits = [];\n  if(allHit!=null) bits.push('All '+legs.length+' hit: <b>'+allHit+'%<\u002Fb>');\n  if(ev!=null) bits.push('EV <b class=\"'+(ev>0?'':'recwarn')+'\">'+(ev>0?'+':'')+(ev*100).toFixed(1)+'%<\u002Fb> per dollar');\n\n  const why = [];\n  why.push('Built by spreading across games, capping legs per player, and skipping anyone listed inactive — not by taking the top '+legs.length+' percentages.');\n  if(note.shortfall>0) why.push('<span class=\"recwarn\">You asked for '+note.requested+' legs; only '+note.built+\n    ' cleared the bar, so this is '+note.built+'. Padding it would make it worse.<\u002Fspan>');\n  if(ev!=null && ev<=0) why.push('<span class=\"recwarn\">Negative EV: this is the best card on the slate, not a card worth playing.<\u002Fspan>');\n\n  return '<div class=\"recbox\">'+\n    '<div class=\"statlbl\">RECOMMENDED SLIP · '+esc(legs.length)+' LEGS'+\n      (note.sides && note.sides!=='both' ? ' · '+esc(String(note.sides).toUpperCase())+'S ONLY' : '')+'<\u002Fdiv>'+\n    rows+\n    (bits.length?'<div class=\"recsum\">'+bits.join(' · ')+'<\u002Fdiv>':'')+\n    '<div class=\"recwhy\">'+why.join('<br>')+'<\u002Fdiv>'+\n    '<button class=\"recload\" type=\"button\" id=\"recLoad\">LOAD INTO SLIP BUILDER →<\u002Fbutton>'+\n  '<\u002Fdiv>';\n}\n\nfunction renderBoardResults(){\n  const resultsEl = document.getElementById('searchResults');\n  if(!LAST_RUN || !LAST_RUN.picks.length){\n    resultsEl.innerHTML='<div class=\"empty\">No bets cleared your filters on this slate.<br>Try widening tiers or props.<\u002Fdiv>';\n    return;\n  }\n  const out = LAST_RUN.out;\n  // How many lines the board carries for each player+stat.\n  const altLineCount = {};\n  for(const p of LAST_RUN.picks) altLineCount[propKeyOf(p)] = (altLineCount[propKeyOf(p)]||0)+1;\n  // Props removed because the player is confirmed not to play. Never silent —\n  // dropping picks without saying so is its own kind of dishonesty.\n  const vn = out.voidedCount || 0;\n  const vd = (out.mlbStatus && out.mlbStatus.voided) || {};\n  const voidBox = vn ? '<div class=\"voidbox\"><b>'+vn+' prop'+(vn===1?'':'s')+' hidden<\u002Fb> — '+\n    [vd.notStarting?vd.notStarting+' not the confirmed starter':'', vd.inactive?vd.inactive+' listed inactive':'']\n      .filter(Boolean).join(', ')+\n    '. PrizePicks <b>voids<\u002Fb> a DNP and refunds the leg; it does not settle at 0, so a low line on someone who isn\\u2019t playing is not a free under.'+\n    ((vd.examples&&vd.examples.length)?'<div class=\"voidex\">'+vd.examples.map(esc).join(' · ')+'<\u002Fdiv>':'')+\n    '<\u002Fdiv>' : '';\n  const recBox = recSlipHtml(out);\n  const sortbar = '<div class=\"sortbar\"><span>SORT<\u002Fspan>'+\n    [['edge','EDGE %'],['team','TEAM'],['time','TIME']].map(([v,l])=>\n      '<button class=\"sortbtn'+(v===boardSort?' active':'')+'\" type=\"button\" data-sort=\"'+v+'\">'+l+'<\u002Fbutton>').join('')+'<\u002Fdiv>';\n  resultsEl.innerHTML = voidBox + recBox + sortbar + sortedPicks().map(p=>{\n    poolAdd(p);\n    // sideProb is P(the side being recommended); p.prob stays P(over) for the\n    // calibration log. Fall back for older payloads that had neither.\n    const side=p.side||p.pick||'over';\n    const sp=(p.sideProb!=null?p.sideProb:p.prob);\n    const v=verdictOf({ verdict:p.sideVerdict||p.verdict, prob:sp }), pc=toPct(sp);\n    const gt=gameTime(p.start);\n    // Raw numbers straight from PrizePicks/ESPN (never the judge), behind a\n    // toggle like \"why\". Team record + win% ride along from the run result.\n    const sHtml = statsHtml(p, { record:(out.teamRecords||{})[p.team], winPct:(out.winProbs||{})[p.team] });\n    const wHtml = (p.key_risk||p.reasoning)\n      ? (p.key_risk?'<div class=\"risk\">'+prose(p.key_risk)+'<\u002Fdiv>':'')+\n        (p.reasoning?'<div class=\"reason\">'+prose(p.reasoning)+'<\u002Fdiv>':'')\n      : '';\n    const inSlip = trayHas(p);\n    // Several lines of one prop on the board is fine to browse — you pick which\n    // line you want — but they're alternates, not additions. Say so.\n    const altLine = altLineCount[propKeyOf(p)] > 1;\n    // The number that decides the ranking, shown so the order makes sense: a\n    // lower percentage on a better-paying tier genuinely IS the better bet.\n    const eg = edgeOf(p);\n    const edgeHtml = eg==null\n      ? '<span class=\"edgeval unpriced\" title=\"PrizePicks prices each side separately and this side\\u2019s payout isn\\u2019t known yet\">price ?<\\u002Fspan>'\n      : '<span class=\"edgeval '+(eg>=0.05?'good':eg>=0.02?'ok':'thin')+'\">'+\n        (eg>=0?'+':'')+(eg*100).toFixed(1)+'pp<\\u002Fspan>';\n    const injHtml = injPanelHtml(p, out.mlbInjuries);\n    const btns =\n      (sHtml?'<button class=\"whybtn\" type=\"button\" data-panel=\"stats\" data-lbl=\"stats\" aria-expanded=\"false\">stats ↓<\u002Fbutton>':'')+\n      (wHtml?'<button class=\"whybtn\" type=\"button\" data-panel=\"why\" data-lbl=\"why\" aria-expanded=\"false\">why ↓<\u002Fbutton>':'')+\n      // Deeper MLB numbers load only when asked, so they never delay a run.\n      (p.mlbId?'<button class=\"whybtn\" type=\"button\" data-mlb=\"'+esc(p.mlbId)+'\" data-panel=\"mlb\" data-lbl=\"mlb\" aria-expanded=\"false\">mlb ↓<\u002Fbutton>':'')+\n      (injHtml?'<button class=\"whybtn\" type=\"button\" data-panel=\"inj\" data-lbl=\"injuries\" aria-expanded=\"false\">injuries ↓<\u002Fbutton>':'')+\n      '<button class=\"addbtn'+(inSlip?' on':'')+'\" type=\"button\" data-add=\"'+esc(legKey(p))+'\">'+(inSlip?'✓ in slip':'+ slip')+'<\u002Fbutton>';\n    // A prop on a player who isn't active isn't a bet — say so on the card, loudly.\n    const inj = p.injured ? '<div class=\"injflag\">⚠ '+esc(p.injured)+' — not expected to play<\u002Fdiv>' : '';\n    return '<div class=\"leg'+(p.injured?' hurt':'')+'\">'+avatarHtml(p.player, p.headshot||p.image)+\n      '<div class=\"info\"><div class=\"name\">'+tierIcon(p.oddsType)+esc(p.player)+'<\u002Fdiv><div class=\"team\">'+\n        esc(p.matchup||p.team||'')+\n        (gt ? ' <span class=\"gtime\">'+esc(gt)+'<\u002Fspan>' : '')+\n        (altLine ? ' <span class=\"altline\">alt line<\u002Fspan>' : '')+'<\u002Fdiv><\u002Fdiv>'+\n      teamMarkHtml(p.teamLogo, p.teamLogoFallback)+\n      '<div class=\"stat-right\"><div class=\"stat\">'+esc(p.statDisplay||p.stat)+' <span class=\"side '+esc(side)+'\">'+esc(side)+'<\u002Fspan> '+esc(p.line)+'<\u002Fdiv>'+\n      '<div class=\"pct '+v+'\">'+(pc==null?'—':pc+'%')+'<\u002Fdiv>'+\n      '<div class=\"edgerow\">'+edgeHtml+'<\u002Fdiv>'+\n      '<div class=\"bar '+v+'\" ><i style=\"width:'+(pc||0)+'%\"><\u002Fi><\u002Fdiv><\u002Fdiv>'+\n      // Both panels collapsed by default: a board can be dozens of rows, and\n      // showing everything at once buries the numbers.\n      inj+\n      (btns?'<div class=\"whyrow\">'+btns+'<\u002Fdiv>':'')+\n      (sHtml?'<div class=\"why\" data-panel=\"stats\" hidden>'+sHtml+'<\u002Fdiv>':'')+\n      (wHtml?'<div class=\"why\" data-panel=\"why\" hidden>'+wHtml+'<\u002Fdiv>':'')+\n      (p.mlbId?'<div class=\"why\" data-panel=\"mlb\" hidden><\u002Fdiv>':'')+\n      (injHtml?'<div class=\"why\" data-panel=\"inj\" hidden>'+injHtml+'<\u002Fdiv>':'')+\n      '<\u002Fdiv>';\n  }).join('');\n}\ndocument.getElementById('searchResults').addEventListener('click', e=>{\n  const sb = e.target.closest('.sortbtn');\n  if(sb){\n    if(sb.dataset.sort===boardSort) return;\n    boardSort = sb.dataset.sort;\n    renderBoardResults();\n    return;\n  }\n  const ab = e.target.closest('.addbtn');\n  if(ab){ trayToggle(ab.dataset.add); return; }\n  if(e.target.closest('#recLoad')){\n    // Prefer the board's own object for a leg (it carries the stats panels and\n    // MLB extras); fall back to the parlay leg itself, which is self-sufficient.\n    const legs = (LAST_RUN && LAST_RUN.out.parlayLegs) || [];\n    tray = legs.map(l=>{\n      const onBoard = LAST_RUN.picks.find(p=>legKey(p) === legKey(l));\n      return onBoard || Object.assign({}, l, { side: l.pick, sideProb: l.prob });\n    }).slice(0, MAX_LEGS);\n    renderBoardResults(); renderTray();\n    document.getElementById('slipTray').scrollIntoView({ behavior:'smooth', block:'start' });\n  }\n});\n\n/* ============================================================\n   SLIP BUILDER\n   Pick legs off the board, price them against real PrizePicks payout tables,\n   save the slip so it can be checked after the games settle.\n   The multiplier math is NOT done here — /api/bet-finder-size owns it (it holds\n   the per-tier tables and the same hit-distribution used everywhere else), so\n   the number you see when saving is the number the grader pays out against.\n   ============================================================ */\nconst MAX_LEGS = 6;\nlet tray = [];                       // the legs you've picked, in pick order\nconst legKey = p => [p.player, p.stat, p.line, p.side||p.pick||'over'].join('|');\n/* Every pick the user can currently add, from ANY tab, keyed the same way.\n   trayToggle used to resolve only against LAST_RUN.picks, so a leg offered\n   anywhere but the search board silently did nothing when tapped — the button\n   rendered, the click landed, and no leg appeared. */\nconst PICK_POOL = new Map();\nconst poolAdd = p => { PICK_POOL.set(legKey(p), p); return p; };\nconst trayHas = p => tray.some(l => legKey(l) === legK
