[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# The whole app is one HTML file, so a cached copy means a stale APP — new
# features appear to be "missing" rather than obviously old. iOS is especially
# sticky once the page is added to the home screen (there's a webmanifest), so
# the document is explicitly never cached. Icons and the manifest still are.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# The muscle map is a separate static app under /workout/. Same reasoning as
# above: the document itself is never cached so a new version is never hidden
# behind a stale copy, especially once it is on an iOS home screen.
[[headers]]
  for = "/workout/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/workout/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
